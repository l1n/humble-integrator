schema = 1
name = "Miroslav Philharmonik 2 CE"
vendor = "ik-multimedia"
kind = "addon"
machine_names = ["miroslavphilharmonik2ce", "miroslavphilharmonikce"]
verified = false
notes = """
Collector's Edition of Miroslav Philharmonik 2 (orchestral sample instrument; plug-in and standalone). Humble lists it as 'Miroslav Philharmonik CE' in Pro Sound Suite with the same description as 2 CE, so both machine names are treated as one product (inference). No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = "Register the Humble serial on the IK account, then install from IK Product Manager (Software tab; sample content from the Sounds tab). Authorization happens in Product Manager."

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
bridge = "yabridge"
prefix = "audio-plugins"
notes = "No Linux build. Untested: Windows installer into the shared audio-plugins Wine prefix, bridged into a Linux DAW with yabridge."

[[sources]]
url = "https://www.humblebundle.com/software/ik-pro-sound-suite-software"
claim = "'Miroslav Philharmonik CE' item described as Miroslav Philharmonik 2 CE (census)"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/29332171355675-IK-Multimedia-Redemption-Instructions-EULA"
claim = "register at ikmultimedia.com/registration; IK Product Manager: Software tab > Install, Sounds tab > Install"
