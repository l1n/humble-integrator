schema = 1
name = "Amberlight 2"
vendor = "escape-motions"
kind = "app"
machine_names = ["amberlight2", "amberlight"]   # "amberlight" = Amberlight 2 in the 2020 Natural Digital Painting Kit and 2021 Paint and Draw bundles
verified = false
notes = "Also in 'Natural Digital Painting Kit' (2020, activation code only) and 'Paint and Draw' (2021): redeem the Humble code at escapemotions.com/community/humblebundle and download Amberlight 2 from the Escape Motions account (as Humble documents for Flame Painter 4; inference for this product). 2023 'Become a Painting Pro with Rebelle 5' bundle: Humble serves Windows and Mac DRM-free builds. Fractal light-art generator. Activates with a registration key from the Escape Motions site (internet needed). Humble's description for this item is a copy of Inspirit's."

[install]
source = "humble"
file = "Amberlight*"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
serial = "account"
notes = "Same build is downloadable from the Escape Motions account (My Account > Purchases) once redeemed."

[launch]
find = "C:/Program Files*/**/Amberlight*.exe"
notes = "Exe name inferred from the installer naming (Rebelle 8 installs 'Rebelle 8.exe')."

[steam]
shortcut = true
title = "Amberlight 2"
steamgriddb = "Amberlight 2"

[platforms.macos]
runner = "native"
file = "*.dmg"
app_find = "/Applications/Amberlight*.app"

[[sources]]
url = "https://www.escapemotions.com/community/humblebundle"
claim = "Humble redeem page ('Humble Software Bundle: Become a Painting Pro'): one code at a time, email verification"

[[sources]]
url = "https://www.escapemotions.com/community/forum/t/719/humble-bundle-activation-code-no-longer-valid"
claim = "staff: Humble codes register products on the site and are not install keys; a used code can't be reused"

[[sources]]
url = "https://www.escapemotions.com/products/rebelle/manual/latest/getting-started/installing/"
claim = "installers 'Rebelle N.exe/.dmg'; installs to Program Files"
