schema = 1
name = "itch.io"
kind = "route"
notes = """
Redemption route for Humble bundles whose keys are itch.io links. Humble
keeps two "Itch.io Redemption Instructions" articles (2021 and 2025). Census
bundles redeemed here are ElvGames' (pixel-art tilesets, monsters,
characters, VFX/UI, music and SFX); "ElvGames's website" in Humble's text
means its itch.io store, to which every item of these bundles links:
- Complete 2D Game Assets Bundle (Apr-May 2025), 90 keys: Humble says
  "Content is redeemed through ElvGames's website", and that website is its
  itch.io store: every item links to elv-games.itch.io, GameFromScratch's
  launch post says "The assets are all redeemed on the Itch.io store", and
  ElvGames points Humble buyers to a single 'Game Assets' download page on
  elvgames.itch.io (packs can also be claimed one by one, to get updates).
- Ultimate Top Down Adventure Assets Bundle (Oct 2025; ElvGames and
  Pegonthetrack packs), 80 keys: "All keys can be redeemed on the ElvGames
  website"; all 80 items link to elvgames.itch.io (inference from that and
  the two bundles around it).
- Ultimate Farming RPG Assets Bundle (May 2026; ElvGames and Pegonthetrack
  packs): "All keys can be redeemed on the ElvGames Itch.io website", and
  "A single key will be provided to redeem content in your bundle"; keys
  expire: "Please redeem before May 28th, 2027".
So vendors/elvgames no longer claims anything; these bundles are matched
here by redemption text and slug. Sellers who merely also sell on itch.io
(GameDev Market sellers, the GAB creators) say a Humble purchase does not
unlock their itch.io pages; their bundles go to their own routes.

What a key is: a link on the Humble download page ("the green link") that
opens an itch.io redemption page; logged in, it claims the bundle (or the
project's download key) into the account. An itch.io download key is a URL
(https://SELLER.itch.io/PROJECT/download/KEY) giving access to the project's
current uploads, including later updates; once linked to an account only its
owner can open it. The library is at itch.io/my-collections ("My Library").

Unlike the other marketplaces this one is scriptable with a documented API:
an itch.io API key lists the user's owned keys
(https://api.itch.io/profile/owned-keys, scope profile:owned). Fetching the
files themselves is what the itch app / butler do; those upload endpoints
are not in the public reference, so treat that part as inference.
"""

[match]
domains = ["itch.io"]
key_names = ['\bitch\.io\b']
redeem_text = ['redeem\w*[^.]{0,60}\bitch\.io\b']   # also "All keys can be redeemed on the ElvGames Itch.io website"
bundle_slugs = [
  '^complete-?2d-?game-?assets-?bundle',     # ElvGames 2025: URL slug and machine name complete2dgameassetsbundle_softwarebundle
  '^ultimate-?top-?down-?adventure-?assets-?bundle',  # ElvGames Oct 2025: URL slug and machine name ultimatetopdownadventureassetsbundle_softwarebundle
  '^ultimate-?farming-?rpg-?assets-?bundle', # ElvGames 2026: URL slug and machine name ultimatefarmingrpgassetsbundle_softwarebundle
]

[redeem]
where = "https://itch.io/my-collections"
account = true
delivers = "the bundle's projects in the itch.io library, with all their current and future uploads"
expires = "per bundle: Ultimate Farming RPG Assets (ElvGames) 'Please redeem before May 28th, 2027'; Complete 2D Game Assets states none; itch.io's docs give download keys no expiry of their own"
expiry_text = "(?i)redeem before ([A-Z][a-z]+ \\d{1,2}(?:st|nd|rd|th)?,? \\d{4})"
steps = [
  "Create or log in to an itch.io account.",
  "On the Humble download page click the (green) redeem link; it opens an itch.io redemption page. Claim the bundle/key to the account.",
  "Follow the page to each project's download page and download the uploads for this OS (assets: everything).",
  "Everything stays under My Library: https://itch.io/my-collections.",
]

[download]
scriptable = true
how = "itch.io server-side API with the user's API key (owned keys), then the project's uploads"
notes = """
Create an API key at itch.io account settings (API keys). GET
https://api.itch.io/profile/owned-keys pages through every owned key (game,
seller, purchase); each project's files are its uploads, which the itch app
and butler download. Games with native builds could then go through the
generic DRM-free app path; assets go to the library folder.
"""

[install]
source = "vendor"
serial = "none"
silent = false
notes = "Assets: unpack into the library folder. Games: native build for this OS first (generic/drm-free-app handling)."

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "native"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/1260802589229-Itch-io-Key-Redemption-Instructions"
claim = "click the green link on the bundle page, redirected to an itch.io redemption page, log in, download page; content again in My Library (itch.io/my-collections)"
[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/36347720060571-Itch-io-Redemption-Instructions"
claim = "create an itch.io account, use the key link to claim the bundle to the account, download the assets (2025)"
[[sources]]
url = "https://itch.io/docs/creators/download-keys"
claim = "a download key is a unique URL giving access to a project's files (purchases, bundles, generated keys); keys linked to an account are only viewable by its owner; current uploads always available to key holders"
[[sources]]
url = "https://itch.io/docs/api/serverside"
claim = "api.itch.io with Bearer API keys; /profile/owned-keys lists owned keys from purchases, claims, bundles and gifts; download URL form SELLER.itch.io/GAME/download/KEY"
