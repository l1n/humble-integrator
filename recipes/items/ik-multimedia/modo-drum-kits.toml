schema = 1
name = "MODO DRUM kits"
vendor = "ik-multimedia"
kind = "content"
machine_names = ["mododrum-plexikit", "mododrum-bubingakit", "modobass_referencekit", "modobass_silverkit"]
verified = false
notes = """
Physically modelled kits for MODO DRUM 1.5: Plexi, Bubinga, Reference, Silver. Humble's machine names for Reference and Silver start 'modobass' but the products are MODO DRUM kits. They need MODO DRUM; IK's free MODO DRUM edition with its Studio kit is the likely host when MODO DRUM is not owned (inference). No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = "Register the Humble serial on the IK account, then install from IK Product Manager (Software tab; sample content from the Sounds tab). Authorization happens in Product Manager."

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
prefix = "audio-plugins"
notes = "Installs into the host plug-in's Windows install in the shared audio-plugins prefix (untested)."

[[sources]]
url = "https://www.humblebundle.com/software/ik-multimedia-presents-studio-essentials-pianos-bass-drums-cinematic-sounds-software"
claim = "'MODO DRUM - Reference Kit' / 'Silver Kit' items (census)"

