schema = 1
name = "MyMiniFactory (3D-print files redeemed on MMF)"
kind = "route"
item_kind = "content"   # STL / Lychee files for a library folder; nothing to install, no Steam entry
notes = """
MyMiniFactory (MMF) is a marketplace for 3D-printable files. Humble's
3D-print "pack" bundles that are fulfilled on MMF give ONE key for the whole
order ("ATTENTION: A single key will be provided to redeem all the content in
your bundle") and say "Keys in this bundle are reedemable [sic] on the
MyMiniFactory site". The packs themselves carry no Humble delivery icon and
nothing downloads from Humble: the key, redeemed on MMF, puts every pack of
the tier you paid for into your MMF Library, and the files come from there.

Census example: The 3D Printable Beastmasters Compendium Bundle (ended
2024-04-18): 28 monster packs by several MMF creators. Humble lists
"MyMiniFactory" as each pack's publisher and links each to its MMF object
page (IDs in [mmf_objects] below). Packs contain unsupported and
pre-supported STL, some also Lychee scenes (.lys).

How MMF redemption works, from Humble's own articles for two 2021 Modiphius
book bundles whose STL files were fulfilled on MMF (Fallout RPG & 3D
Miniatures; Mutant Chronicles). Humble's download page carries a link to
MyMiniFactory, which invites you to redeem the Humble files and asks you to
sign in or create an account. The files are then added to your MMF Library
automatically, under the tab "Objects shared with me", in a folder named
after the bundle (e.g. "HumbleBundle", "Mutant Chronicles RPG 3D Print
Characters"). HighCraft's 2021 bundle went through a creator-run redeem page
instead, which emails an MMF link, and ended in the same tab (see
vendors/highcraft-miniatures). Not confirmed for the 2024 key bundles:
whether the key is a link or a code typed on MMF. Humble's instructions
next to the key decide.

Matching: publisher/developer "MyMiniFactory", plus bundle redemption text
that names MMF as the place to redeem, claim or receive files or codes. So
every part of a pack, and later MMF-fulfilled bundles from any creator,
resolve here. Bundles that only mention an MMF store, such as Master Forge
(DRM-free, licence page on MMF), are not matched. Extracted keys match
myminifactory.com in Humble's key instructions. Creators with their own
recipe (e.g. highcraft-miniatures, hayland-terrain) match first and carry
the same MMF steps.
Caveats (inference): if a future bundle lists MMF as publisher but Humble
serves the files itself, those downloads also land here. That is harmless:
`hi apply` still fetches a vendor-route item's Humble downloads. A mixed
bundle (ebooks downloaded from Humble, STLs on MMF, like the Modiphius ones)
whose text matches would put its ebooks in this vendor's folder too.
"""

[match]
developers = ["MyMiniFactory", "My Mini Factory"]
domains = ["myminifactory.com"]
key_names = ["myminifactory", "my mini factory", "beastmasters compendium", "3dprintablebeastmasterscompendium"]
redeem_text = [
  're+de+m\w*[^.]{0,80}\bmy ?mini ?factory',              # "reedemable on the MyMiniFactory site", "redeemed on MyMiniFactory", "redeem via MyMiniFactory"
  '\bmy ?mini ?factory\b[^.]{0,20}\b(site|website|account|library)\b',
  '\bclaim\w*[^.]{0,80}\bmy ?mini ?factory',               # "claim your files on MyMiniFactory"
  '\bmy ?mini ?factory\b[^.]{0,20}\b(keys?|codes?)\b',     # "a MyMiniFactory code"
  '\b(delivered|fulfill?ed|unlock\w*)\b[^.]{0,40}\b(on|via|through|at)\s+(the\s+)?my ?mini ?factory',
]

[redeem]
where = "https://www.myminifactory.com/library"
account = true
delivers = "every pack of the tier bought, in the buyer's MyMiniFactory Library under 'Objects shared with me', in a folder named after the bundle; each pack downloads as one or more archives (.zip, sometimes .rar) of STL files (unsupported and pre-supported) and, where the pack says so, Lychee .lys scenes"
expires = "No deadline on the Beastmasters page. Humble's terms (Dec 2024) expire unrevealed/unclaimed keys 3 years after purchase; Key.is_expired from Humble is authoritative. Redeemed files stay in the MMF Library."
steps = [
  "Open the bundle's Humble download page. Reveal the single key if it has one (Keys & Entitlements). It covers every pack in the tier you paid for; there is no per-pack key and you cannot add packs later.",
  "Follow the MyMiniFactory link or instructions Humble shows there. MMF invites you to redeem the Humble files.",
  "Sign in to, or create, a free MyMiniFactory account when asked (email and password, or Google). Use one MMF account for every Humble MMF key.",
  "The files are added to your MMF Library automatically, and you should be redirected there. If not, open https://www.myminifactory.com/library, tab 'Objects shared with me', and expand the folder named after the bundle.",
  "Download each pack's archive(s), save each pack under <library>/3d-print/myminifactory/<pack name>/, and unpack it there with 7z (handles .zip, .rar and .7z).",
  "Download trouble on MMF: https://www.myminifactory.com/contact_us/; redemption trouble: Humble support.",
]

[install]
source = "vendor"
serial = "none"
file = "*.zip"
unpack = "7z"
notes = "Files only: no installer. Some creators split a pack into several archives (unsupported / pre-supported / Lychee) or use .rar."

[download]
scriptable = "unverified"
how = "from the MMF Library (Objects shared with me) in a browser; by script only through the MMF API with OAuth"
api = "https://www.myminifactory.com/api/v2"
auth = "OAuth 2.0 authorization-code or implicit flow: https://auth.myminifactory.com/web/authorize?client_id=...&redirect_uri=...&response_type=code&state=...; token from https://auth.myminifactory.com/v1/oauth/tokens. The user creates the API client in their MMF account settings."
endpoints = [
  "GET /objects/{object_id}: archive_download_url (only for an OAuth-connected user, not with an API key)",
  "GET /objects/{object_id}/files: items[].download_url per file (OAuth user only)",
  "GET /files/{file_id}: one file's download_url",
]
notes = """
A script can fetch the files once the user has redeemed the key and
authorised it through OAuth: for each object ID, GET /objects/{id} and save
archive_download_url, or list /objects/{id}/files and save each download_url.
The published API has no endpoint that lists a user's Library, purchases or
"Objects shared with me", so the script needs object IDs. [mmf_objects] maps
every Humble machine_name of this route to the MMF object Humble linked it
to (from the archived Humble page). Unconfirmed inference: that the
redeemed entitlement is exactly those objects (not one combined bundle
object), and that shared objects return download URLs through these
endpoints. Check the Library after the first redemption. Without API
access, download from the Library in a browser. A community browser
extension ("MyMiniFactory Download All") adds a button that fetches a
release's archives, PDFs and parts one at a time. Scraping the Library
HTML is not dependable: the site sits behind bot protection.
"""

[library]
files = "per pack: unsupported STL, pre-supported STL, and Lychee .lys scenes where the pack lists them, as .zip/.rar archives"

[mmf_objects]   # Humble machine_name -> MyMiniFactory object id (https://www.myminifactory.com/object/<id>)
