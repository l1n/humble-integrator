schema = 1
name = "Pretzel Rocks (stream-safe music service)"
kind = "route"
service = true
notes = """
Streaming 2019 (Jun 2019): Pretzel Rocks Premium for 1 month, 3 months or 1
year by tier (desktop player for Windows/Mac/Linux plus web). Codes don't
stack (a shorter code overwrites a longer one) and had to be redeemed before
2021-06-01, so unredeemed codes are almost certainly dead.
"""

[match]
developers = ["Pretzel Tech"]
domains = ["pretzel.rocks"]
key_names = ['\bpretzel\b']

[redeem]
where = "https://www.pretzel.rocks/humble"
account = true
delivers = "Pretzel Rocks Premium for 1, 3 or 12 months"
expires = "2021-06-01"
expiry_text = "Keys must be redeemed before June 1st, 2021"
steps = [
  "Open https://www.pretzel.rocks/humble and create or log in to a Pretzel account.",
  "Fill in the form with the Premium code from the Humble download page.",
  "Check the subscription under Account Settings > Subscription. Don't redeem a 1-month code over a longer one (codes overwrite).",
  "Support: https://pretzel.zendesk.com/hc/en-us.",
]

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/360023995413-Humble-Software-Bundle-Streaming-2019-Pretzel-Rocks-Premium-instructions"
claim = "1/3/12-month key by tier; keys don't stack and can be overwritten; redeem before June 1st, 2021; pretzel.rocks/humble"
[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/360023925913-Humble-Software-Bundle-Streaming-2019-System-Requirements"
claim = "Pretzel Rocks Premium listed for Windows, Mac and Linux; codes expire 6/1/2021"
