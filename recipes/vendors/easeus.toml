schema = 1
name = "EaseUS"
kind = "route"
notes = """
Windows utilities (partition/backup/PC-transfer/key-finder tools) plus a few
cross-platform apps (Video Downloader, RecExperts, Data Recovery Wizard have
Mac editions). A Humble EaseUS key is a 25-character licence code typed into
the activation window at first launch; no account. Term varies: 2022 Humble
OS2Go / Todo PCTrans keys were one-year; the 2025 'EaseUS x Ashampoo' items
match Ashampoo's lifetime, 2-device SKUs (inferred).
The 2022 'Windows 11 Migration' bundle (developer spelled 'CHENGDU Yiwo®
Tech Development Co.') sold one-year keys for Data Recovery Wizard Pro,
Partition Master Pro, Todo Backup Home, Todo PCTrans Pro, OS2Go, Disk Copy
Pro and Deploy Manager; Humble's per-product articles say 'activation code
from your bundle page', and Disk Copy is 'good for one year'. The 2025 bundle lists
Ashampoo as publisher; the item recipes claim those items by machine name.
Most EaseUS tools manage the Windows installation or disks they run on,
which is meaningless (or risky) inside a Wine prefix: those items are
marked skip. Only Video Downloader-type apps make sense, natively on Mac.
"""

[match]
developers = ["EaseUS", "EaseUS Software", "CHENGDU YIWO Tech Development Co., Ltd", "CHENGDU Yiwo® Tech Development Co."]
domains = ["easeus.com"]
key_names = ["easeus"]

[redeem]
where = "the program's activation window at first launch"
account = false
delivers = "an activated licence (1 or 2 PCs depending on product)"
expires = "some Humble EaseUS keys were one-year licences (2022); check the item"
steps = [
  "Download the program from the link in Humble's instructions (down.easeus.com ... ?ref=hb) or easeus.com.",
  "Install, start, and paste the 25-character code into the activation window (or 'Upgrade to Full Version' > Enter License).",
  "Offline: generate a machine code and use https://activation.easeus.com/alloffline.php.",
]

[install]
source = "vendor"
serial = "per-product"
silent = false
driver = "nsis"
driver_notes = 'down.easeus.com links are ~1.5 MB NSIS 3.03 online stubs (admin required) that fetch the full Inno Setup installer; full installers install to %ProgramFiles%\EaseUS\<product> (e.g. EaseUS Todo PCTrans\bin\PCTrans.exe). No documented silent switches for the stubs.'

[platforms.macos]
runner = "native"
notes = "Only some EaseUS products have Mac editions (Video Downloader, RecExperts, Data Recovery Wizard); Key Finder, PCTrans and OS2Go are Windows-only. Whether a Windows code activates a Mac edition is undocumented (Humble's Video Downloader article links both builds)."

[platforms.linux]
runner = "wine"
notes = "No Linux editions; the system tools are pointless under Wine."

[[sources]]
