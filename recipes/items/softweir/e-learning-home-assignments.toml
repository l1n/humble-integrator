notes = "E-book and home-assignment DLC for 001 Game Creator. Steam keys in the 2024 STEM bundle (Steam keys always go to generic/steam-key there); in the Oct 2020 Game Dev STEM bundle Humble shows no icon, so this recipe treats them as Steam DLC keys too (inference). Redeem on Steam; they install into 001 Game Creator."

[install]
