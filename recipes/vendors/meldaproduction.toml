claim = "licence files, drag-and-drop activation, no internet or dongle, any number of personally owned computers, 20% transfer fee"
[[sources]]
url = "https://www.meldaproduction.com/about/system-requirements"
claim = "Windows 10/11 64-bit, macOS 10.14+, formats; Linux not supported but apparently works under Wine with MS TrueType fonts"
[[sources]]
url = "https://www.meldaproduction.com/downloads"
claim = "MPluginManager installs all Melda plugins (installer 03.01, Win .exe / Mac .zip)"
