schema = 1
name = "Humble store / Choice coupon"
kind = "route"
priority = 5
before_vendors = true
# Coupons for Steam games show Steam's icon, but they are coupons, not Steam keys.
before_steam = true
notes = """
Humble's own discount coupons that ride along in bundles ("10% off Humble
Choice", "25% off ..."). Nothing to install or redeem elsewhere: the coupon
shows in the Humble library and applies at Humble's checkout. Listed by `hi plan`
as a service so it isn't swept onto the bundle's vendor route.
"""

[match]
machine_names = ["^humblemonthly_", "humblechoice", "^humble_?choice",
  # Humble Store discount coupons riding along in game bundles
  # (a discount amount in the name; vendor coupons without one stay with their vendor)
  "\\d+perc?ent?off", "\\d+perecentoff",  # "perecent": Humble's own typo
  # not "hib7offspringfling", "1970officeenvironment", "350-801officialcertguide"
  "\\d+off(?!ic|spring|line|set|road|world|ensive|shore)",
  "^humblestore", "humblestorediscount", "coupon_.*_bundle$"]
developers = ["Humble Choice"]
