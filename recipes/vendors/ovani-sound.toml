schema = 1
name = "Ovani Sound"
kind = "route"
notes = """
Royalty-free game music packs, sound-effect packs, voice packs, the
Apprehension Engine sample library, and game-engine music/audio plugins for
Unity, Unreal, Godot, Roblox and Minecraft. Every Ovani bundle on Humble is
redeemed on Ovani's own Shopify store with a 100%-off coupon, including the
items Humble's page shows with a download or audio icon: Ovani keeps an
unlisted "Humble Bundle: <bundle> - TIER n" redemption product for each tier
of each bundle, and adding it to the cart adds that tier's packs. Several
bundles say one key redeems the whole bundle; where Humble lists a key per
pack, Ovani's pages still describe one coupon per tier purchase, so expect
the same code repeated (unverified). A coupon works once; the
downloads can be fetched again any time from the store account's orders.

Formats (Ovani product pages): music packs are 48 kHz/24-bit WAV, each track
in three intensities plus 30 s and 60 s cuts; most SFX and voice packs are
44.1 kHz/16-bit WAV with metadata tags; the Apprehension Engine library is
96 kHz/24-bit. Engine plugins are project add-ons, not system installs (see
items/ovani-sound/*).

Licence (FAQ): perpetual, royalty-free, personal and commercial use; no
resale or redistribution of the unaltered files; for open-source games embed
the audio in the build rather than committing it to a public repository.

Matched by developer name because Ovani's store says the coupon delivers
everything. Caveat (inference): if some user's Humble download page does
offer Ovani files directly, `hi apply` currently lists them under this route
instead of downloading them; fetch them from Humble by hand or use the coupon.
"""

[match]
developers = ["Ovani Sound", "Ovani"]
# For extracted keys whose instructions don't name Ovani: Ovani bundles by URL slug,
# bundle-name slug ("the-audio-odyssey-bundle") and machine name ("audioodysseybundle").
# Deliberately not matching the census URL slugs of the Audio Alchemy (2024, Encore)
# and Audio Odyssey Encore (2023) bundles, which also hold a Humble Choice coupon.
bundle_slugs = [
  '^the-audio-odyssey-bundle', '^audio-odyssey-bundle-software', '^audio-odyssey-vol-2', '^audioodyssey',
  '^audio-alchemy-a-premium', '^audio-alchemy-vol-2', '^audioalchemy',
  '^audio-?arcade', '^audio-?arsenal', '^audio-?apocalypse', '^apprehension-?engine',
  '(^|-)decibel-?domination', '^infinite-?echoes', '^harmonic-?hauntings', '^melodic-?mayhem',
  '^multiverse-?music',
]
domains = ["ovanisound.com"]
key_names = ['ovani']

[redeem]
where = "https://ovanisound.com/"
account = true
expires = "Humble shows a redeem-by date on some bundles (Audio Alchemy Vol. 2: before 14 Aug 2027); a coupon can be used only once."
delivers = "a $0 order on ovanisound.com whose download links (WAV zips, engine-plugin packages) are emailed and kept in the account's order history"
steps = [
  "Create or log into an account on ovanisound.com (Log in / Create account at the top of the store) so the order is kept in your history.",
  "Open the unlisted redemption product for the tier you bought (see [redeem.tier_products]; the URL is https://ovanisound.com/products/<handle>). Add only that tier: a higher tier's product appears to contain the lower tiers' packs (inference from pack counts and prices, e.g. Audio Odyssey Tier 3 = all 32 packs).",
  "Click Add to cart. Do not remove the tier item: the store adds the packs and discounts everything, including the tier item, to $0.",
  "Use the normal checkout, not PayPal, Apple Pay or Google Pay (they ignore coupons). Scroll to the bottom of the checkout page; the discount-code field is at the bottom right. Enter the Humble key.",
  "The total must be $0.00 and the card fields disappear. If checkout asks for card details, stop: the coupon was not applied.",
  "Place the order, then download every zip from the confirmation email or the account's order page into the library folder (audio/ovani-sound/<pack>).",
]

[redeem.tier_products]
# Humble bundle (census slug prefix) -> Ovani redemption product handles, tier 1 first.
# Handles were read from ovanisound.com/products/<handle>.json in Oct 2026; tiers
# not listed returned 404 or were not probed. Encore editions presumably reuse
# their original bundle's products (unconfirmed).
"audio-odyssey-bundle" = ["humble-bundle-tier-1", "humble-bundle-tier-2", "humble-bundle-tier-3"]
"audio-arcade-definitive-collection" = ["humble-bundle-audio-arcade-tier-1", "humble-bundle-audio-arcade-tier-2", "humble-bundle-audio-arcade-tier-3"]
"audio-alchemy-premium-collection" = ["humble-bundle-audio-alchemy-tier-1", "humble-bundle-audio-alchemy-tier-2", "humble-bundle-audio-alchemy-tier-3-copy"]
"infinite-echoes-ultimate-game-sound" = ["humble-bundle-infinite-echoes-tier-1", "humble-bundle-infinite-echoes-tier-2", "humble-bundle-infinite-echoes-tier-3"]
"audio-arsenal-comprehensive" = ["humble-bundle-audio-arsenal-tier-1", "humble-bundle-audio-arsenal-tier-2", "humble-bundle-audio-arsenal-tier-3"]
"audio-odyssey-vol-2" = ["humble-bundle-audio-odyssey-vol-2-tier-1", "humble-bundle-audio-odyssey-vol-2-tier-2"]
"audio-apocalypse-worldending" = ["humble-bundle-audio-apocalypse-tier-1", "humble-bundle-audio-apocalypse-tier-2", "humble-bundle-audio-apocalypse-tier-3"]
"melodic-mayhem-vol-2" = ["humble-bundle-melodic-mayhem-vol-2-tier-1", "humble-bundle-melodic-mayhem-vol-2-tier-2", "humble-bundle-melodic-mayhem-vol-2-tier-3"]
"decibel-domination" = ["humble-bundle-decibel-domination-tier-1", "humble-bundle-decibel-domination-tier-2", "humble-bundle-decibel-domination-tier-3"]
"audio-alchemy-vol-2" = ["humble-bundle-audio-alchemy-vol-2-tier-1", "humble-bundle-audio-alchemy-vol-2-tier-2", "humble-bundle-audio-alchemy-vol-2-tier-3"]

[install]
source = "vendor"
serial = "none"
notes = "Nothing to install for the packs: unzip into the library folder. Engine plugins are imported into a game project by hand (see item recipes)."

[platforms.macos]
runner = "native"
[platforms.linux]
runner = "native"

[[sources]]
url = "https://ovanisound.com/products/humble-bundle-audio-arcade-tier-1"
claim = "Humble redemption product: add to cart, keep it in the cart, Humble coupon takes 100% off, normal checkout only (no PayPal/Apple Pay/Google Pay), coupon field bottom right, no card fields"
[[sources]]
url = "https://ovanisound.com/products/humble-bundle-tier-3"
claim = "Audio Odyssey Tier 3 redemption product contains all 32 packs (higher tier includes lower tiers)"
[[sources]]
url = "https://ovanisound.com/products/humble-bundle-audio-alchemy-vol-2-tier-1"
claim = "the same coupon flow is still used for 2026 bundles"
[[sources]]
url = "https://support.fanatical.com/hc/en-us/articles/27354507539346-How-to-redeem-your-Ovani-keys"
claim = "same store flow for Fanatical buyers: account first, purchase redeemable once, downloads emailed and in order history, re-downloadable (read via search summary; page blocks bots)"
[[sources]]
url = "https://ovanisound.com/pages/faq"
claim = "licence: perpetual, royalty-free, commercial use allowed, no resale, keep audio out of public repos"
[[sources]]
