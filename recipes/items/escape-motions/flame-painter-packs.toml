schema = 1
name = "Flame Painter brush packs and particle systems"
vendor = "escape-motions"
kind = "content"
machine_names = [
  "brushpack_flame",
  "brushpack_ribbon",
  "brushpack_follow",
  "brushpack_fuzzy",
  "particlesystemflame",
  "particlesystemribbon",
  "particlesystemfollow",
  "particlesystem_fuzzy",
]
requires = ["escape-motions/flame-painter-4"]
verified = false
notes = "Brush Packs and Particle Systems (Flame, Ribbon, Follow, Fuzzy) for Flame Painter 4. Each Humble code is redeemed on the Escape Motions site. Particle systems are account entitlements that unlock in the app after the Community login (limited to 3 devices); brush packs are (inferred) zips of brush images: drag them onto Flame Painter's Brushes panel, or copy them into Help > Show Library Folder > Brushes and reopen the app. Grouped in one recipe because they install identically."

[install]
source = "vendor"
file = "*"
serial = "account"

[steam]
shortcut = false

