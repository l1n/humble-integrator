schema = 1
name = "Unity Audio Occlusion Plugin"
vendor = "ovani-sound"
kind = "content"
machine_names = ["unityaudioocclusionplugin"]
verified = false
notes = """
Voxel-based audio occlusion for Unity (range, decay, voxel resolution, ignored layers). Example scene at Assets/AudioOcclusionPlugin/Example/Example.unity; embedded text and video docs. A game-engine add-on, not a system install: it goes into a Unity project (Requires Unity 2021.3+ for the music, ambience and footsteps plugins), by hand, per project; no Steam entry. Humble lists Windows/macOS/Linux icons on some bundles; the plugin is engine code and presumably runs wherever the engine runs (inference).
"""

[install]
source = "vendor"
serial = "none"
notes = """
Download from the Ovani order after redeeming the Humble coupon, keep the archive in the library (audio/ovani-sound/plugins/), then: Import the package into the project (Assets > Import Package > Custom Package, or drag it into the Project window; inference). Package format not checked.
"""

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "native"

