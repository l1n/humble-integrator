schema = 1
name = "Paintstorm Studio and Realistic Paint Studio"
kind = "route"
notes = """
Two painting apps by the same developer (Aleksandr Komarov), sold on Humble
in 2024 with publisher Graphixly LLC ('Keys are redeemed through Paintstorm
Studio website'). Neither app takes a serial: you register inside the app
with the email of your Paintstorm / Realistic Paint account, which binds the
licence to the machine's Hardware ID (one machine at a time; moving it means
deactivating the Hardware ID in the account, at most once a week).
How a Humble key becomes that account licence is not documented (inferred:
the key is redeemed/attached on the Paintstorm site, otherwise email
license@paintstormstudio.com with the key).
Paintstorm Studio has native Windows, macOS AND Linux builds - use the native
one everywhere. Realistic Paint Studio is Windows/macOS only (Linux: Wine).
A Wine prefix or a fresh install counts as a new Hardware ID.
"""

[match]
developers = ["Paintstorm Studio", "Realistic Paint Studio"]
domains = ["paintstormstudio.com", "realisticpaint.com"]
key_names = ["paintstorm", "realistic paint studio"]

[redeem]
where = "https://www.paintstormstudio.com/login.html"
account = true
delivers = "a perpetual one-machine licence tied to the account email"
expires = "none documented"
steps = [
  "Log in at https://www.paintstormstudio.com/login.html ('First time login' emails a password for the address) and attach the Humble key to the account; the exact Humble redemption page was not found - if there is none, email license@paintstormstudio.com with the key.",
  "Download the build for this OS from https://www.paintstormstudio.com/download.html.",
  "Start Paintstorm (v1.41+), enter the account email and press Register (internet needed once; works offline after).",
  "Realistic Paint Studio: same scheme on realisticpaint.com (support: info@realisticpaint.com); register in the app by email.",
  "To move a licence: deactivate the Hardware ID in the account (once a week at most).",
]

[install]
source = "vendor"
serial = "account"
silent = false
driver = "unknown"
driver_notes = "Windows installer framework not verified (the site blocks scripted downloads). Linux: Paintstorm_linux_v*.run.tar.gz, officially installed with `sudo sh ./Paintstorm_linux_vX.run` into /usr/share/paintstorm; the tool should ask before running anything as root (whether the .run can be extracted to a user directory instead is untested)."

[platforms.macos]
runner = "native"
notes = "Native .pkg for both apps; Gatekeeper override needed for Paintstorm. .app names not verified."

[platforms.linux]
runner = "native"
notes = "Paintstorm: native x64 build (needs Wacom drivers for pressure). Realistic Paint Studio: no Linux build, use Wine (no reports found)."

