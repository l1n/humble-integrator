From the 2021 13th Age bundle: $25 off a 13th Age print order of more than
$35 in the Pelgrane Press webstore. It could not be combined with other
vouchers and did not cover shipping. Expired on December 31st, 2021; kept so
the item is accounted for.
"""

[redeem]
where = "https://www.pelgranepress.com/shop/"
