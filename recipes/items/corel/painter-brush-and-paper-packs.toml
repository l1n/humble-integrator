notes = """
Painter Brush Packs and Paper Packs from every Corel bundle (DRM-free Win/Mac
downloads, or keys in the 2023 'Create and Elevate' bundles). Grouped because
they all install the same way: run the pack's installer (or import the
library) and relaunch Painter; brush libraries can also be imported via
Brushes > Import > Brush Library (or double-clicking the library file), paper
libraries via Papers panel > Manage Libraries > Import Paper Library.
Install into the same prefix (or Mac) as Painter. Some bundles used bare
machine names for the same packs (abstract, animation, creepers, desert,
expressive, fantasy, magical, photoportrait, rain, stain, wedding, wizard);
those are too generic to claim here and fall to the Corel vendor recipe.
"""

[install]
source = "humble"
file = "*"
serial = "none"

[steam]
shortcut = false

[[sources]]
url = "http://apps.corel.com/redirect?_redirect=command&function=pdf&subfunction=userguide&app=painter&version=2022&lang=EN"
claim = "Painter 2022 User Guide: serial typed during install; activation needs internet + registration; brush/paper library import"

