schema = 1
name = "MAGIX (Music Maker, Video Pro X, Photostory, Photo Manager) and VEGAS / SOUND FORGE (now Boris FX)"
kind = "route"
notes = """
Windows-only creative software. Humble's MAGIX/VEGAS items are serials: the
installer comes from the Humble bundle page (Humble warns installers from
elsewhere may not accept the bundle voucher), the serial is entered in setup
or at first start, and activation is online with a MAGIX account (serial +
email). Activation binds to the device and the program re-validates online
at least once a month (a few days' grace), so the prefix needs network
access for as long as it is used. Licences from these bundles are
perpetual ('Unlimited').
Boris FX bought VEGAS Pro, SOUND FORGE and ACID Pro in March 2026; licences
bought under MAGIX stay with MAGIX (Service Center > My products, which also
hosts the legacy installers), while new Boris FX versions use Boris FX
account logins. VEGAS: 2 installs, 1 running at a time.
Wine/Proton status is poor: no working reports for current versions (VEGAS
Pro 18 Edit is 'borked' on ProtonDB; older VEGAS versions crash at start
under Wine). Treat Linux/macOS installs as experimental. Many MAGIX/VEGAS
products are also sold on Steam; Steam keys for them stay on
generic/steam-key (key_names here only match 'magix'/coupon names).
"""

[match]
developers = ["MAGIX", "MAGIX Software GmbH", "MAGIX Software", "VEGAS Creative Software"]
domains = ["magix.com", "vegascreativesoftware.com", "producerplanet.com", "magix.info"]
key_names = ["magix", "soundpool", "producer ?planet"]

[redeem]
where = "the program's activation dialog (serial + MAGIX account); management at the MAGIX Service Center (My products)"
account = true
delivers = "a perpetual, device-bound licence; installers and serials listed under MAGIX Service Center > My products"
expires = "software: none ('Unlimited' in Humble's terms); content coupons can expire (a 2024 bundle's soundpools expired 8/31/2024); check the Humble download page"
steps = [
  "Download the installer from the Humble bundle page (not from magix.com: it may not take the voucher) and reveal the serial.",
  "Install; enter the serial when setup or the first start asks, choose 'Activate & register immediately online', and sign in to or create a MAGIX account (email).",
  "Keep the prefix online: the licence re-validates at least monthly. To move it, deactivate under MAGIX Service Center > My products (device changes allowed about once a month).",
  "Content coupons: see their service recipe (redeemed in Music Maker's Store or on producerplanet.com).",
]

[install]
source = "humble"
serial = "per-product"
silent = false
driver = "magix-setup"
driver_notes = "MAGIX installers are a 'MAGIX Setup' download manager (the trial stub is ~6 MB, '_dlm_' in the name) with a serial page and an account sign-in, MSI-based underneath (inferred from Windows Installer strings). No silent switches are documented for the consumer products; the only precedent is Sequoia's setup accepting /q. Run interactively and let the tool type the user's serial and email."

[platforms.macos]
runner = "crossover"
windows = "win10"
notes = "No Mac versions (the old SOUND FORGE Pro Mac is discontinued). CrossOver untested; VEGAS needs a GPU-heavy Windows stack and is unlikely to run."

[platforms.linux]
runner = "wine"
fallback = "proton"
notes = "No native builds; Proton/Wine reports are negative or absent (VEGAS Pro 18 Edit borked; older VEGAS crash at start; a 2025 VEGAS 22 on Pop!_OS thread reports no success). Music Maker / Photostory / Photo Manager untested."

