schema = 1
name = "Krotos Studio (3-month subscription)"
vendor = "krotos"
kind = "service"
machine_names = ["krotosstudio3monthssubscription"]
verified = false
notes = """
Three months of Krotos Studio (procedural preset app for whooshes, transitions, ambiences, footsteps, Foley; standalone and VST/AU/AAX plug-in). The key is a coupon for the subscription at krotos.studio: the checkout takes card details even at 100% off and the plan renews unless cancelled from the account page before the free period ends. Redeem only when it can be used. The app itself is downloaded from krotos.studio after subscribing; no Steam entry.
"""

[install]
source = "vendor"
serial = "account"
notes = "Log in at krotos.studio, choose the plan the coupon is for, apply the coupon, check out (card required), download Krotos Studio from the downloads page. Cancel at krotos.studio/profile before renewal."

[steam]
shortcut = false

