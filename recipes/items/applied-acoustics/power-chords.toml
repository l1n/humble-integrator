schema = 1
name = "Power Chords (AAS sound pack)"
vendor = "applied-acoustics"
kind = "content"
machine_names = ["powerchords"]
requires = ["applied-acoustics/aas-player"]
verified = false
notes = """
Preset sound pack for Strum GS-2: chord-driven rock/pop guitar sounds. Humble's description says String Studio VS-3; AAS's page says Strum GS-2. Plays in the free AAS Player (listed as required: the full Strum GS-2 is usually not in the same bundle) or in the full synth if you own it. Royalty-free. No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = """
Registered with its Humble key on the AAS account; install with the account's installer for the pack (or the 'All' installer), after the AAS Player.
"""

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
prefix = "audio-plugins"
notes = """
Installs into the AAS Player's Windows install in the shared audio-plugins prefix (untested).
"""

[[sources]]
url = "https://www.applied-acoustics.com/power-chords/"
claim = "Only compatible with Strum GS-2 and the free AAS Player"

[[sources]]
url = "https://www.applied-acoustics.com/support/apple-m1-compatibility/"
claim = "all sound packs native on Apple Silicon"
