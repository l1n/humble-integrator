schema = 1
name = "Unreal Music Plugin"
vendor = "ovani-sound"
kind = "content"
machine_names = ["unrealmusicplugin", "unrealaudioplugin"]
verified = false
notes = """
Music integration for Unreal Engine 5: intensity changes, song selection, random play, seamless loops. Includes Music Sampler Mixtape Vol. 1 and a video tutorial. 'Unreal Audio Plugin' (2023 bundles) is the old name. A game-engine add-on, not a system install: it goes into an Unreal Engine 5 project (Requires Unreal Engine 5+ for the music plugin), by hand, per project; no Steam entry. Humble lists Windows/macOS/Linux icons on some bundles; the plugin is engine code and presumably runs wherever the engine runs (inference).
"""

[install]
source = "vendor"
serial = "none"
notes = """
Download from the Ovani order after redeeming the Humble coupon, keep the archive in the library (audio/ovani-sound/plugins/), then: Copy the plugin into the project's Plugins/ folder (or the engine's Plugins/Marketplace) and enable it in Edit > Plugins (inference). Package format not checked.
"""

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "native"

