schema = 1
name = "Zenva Academy (online courses)"
kind = "route"
service = true        # course platform: nothing to install, no Steam entry
notes = """
Humble's Zenva bundles are online courses on Zenva Academy
(academy.zenva.com). The Humble "key" is a Zenva coupon. It is not
per course: Humble gives a coupon for the tier bought, and Zenva sells a $0
"N Item Bundle" product per tier that already includes every lower tier.
Redeem only the product for the highest tier you bought, one bundle per
checkout. Zenva's help centre keeps the definitive list of those products
(add-to-cart links); [[redeem.products]] below copies it (Oct 2026).

Safety: the coupon is applied at a real shop checkout. Never press Checkout
unless the order total shows $0. A non-zero total means the wrong product or
other items are in the cart: empty https://academy.zenva.com/cart/ and
start again. Zenva never asks for a subscription for Humble redemptions.
A coupon works once, for one Zenva account.

Offline use: Zenva does not allow course videos to be downloaded ("due to
copyright protection"). The tool can fetch, after login, each course's
"Files" (project source, assets, presentation material and text "lesson
notes" summarising every video) into the library folder, from the course or
lesson page's Files button. Zenva *ebooks* bought on academy.zenva.com are
PDFs under My Account > Downloads. Zenva's mobile app was withdrawn in Feb
2023; courses stream in any browser.

Not Zenva redemptions: Zenva's Humble *ebook* bundles (Godot Game
Development Book Bundle, The Claude Code Mastery Bundle, The Unity Game
Development Mastery Bundle, The Codex Mastery Bundle) are PDF/EPUB downloads
on Humble itself. If their items name Zenva as developer/publisher, this
recipe's developer rule would claim them. Their files must still be fetched
from Humble like any ebook. None are in the census yet (Oct 2026).
"""

[match]
developers = ["Zenva", "Zenva Academy", "Zenva Pty Ltd"]
domains = ["zenva.com", "zenva.zendesk.com"]
key_names = ["zenva"]
bundle_slugs = ["zenva.*software"]
# Both patterns refuse ebook bundles (leading guard): Zenva's Humble ebook
# bundles are Humble downloads, and Zenva's publisher blurb ("Zenva
# https://academy.zenva.com Trusted by ...") would otherwise claim them.
redeem_text = [
  # "redeemed on the Zenva Academy website", "available on the Zenva Academy website", "Please redeem
  # your keys on Zenva.com", "https://academy.zenva.com", "from the experts at Zenva Academy"
  '^(?!.*\b(?:book bundle|bundle of (?:e-?)?books|(?:e-?)?books (?:from|by) zenva)).*?(?:\bzenva(?:\.com| academy)? website|redeem[^.]{0,80}\bzenva|\bzenva\.com\b|\bexperts at zenva\b)',
  # "bundle of courses from Zenva", "instructor-led courses by Zenva", "lessons by Zenva", unless the
  # keys are redeemed on another named website
  '^(?!.*\b(?:book bundle|bundle of (?:e-?)?books|(?:e-?)?books (?:from|by) zenva))(?!.*\bredeem\w*\s+(?:on|through|via|at)\s+(?:the\s+)?(?!zenva)[\w.-]+(?:\s+academy)?\s+website).*\b(?:courses?|lessons)\s+(?:from|by)\s+zenva\b',
]

[redeem]
where = "https://helpza.zenva.com/portal/en/kb/articles/i-purchased-courses-through-humble-bundle-how-do-i-access-them"
cart = "https://academy.zenva.com/cart/?add-to-cart={product}"
account = true
delivers = "the tier's courses on the Zenva account's Purchased Courses page (https://academy.zenva.com/purchased-courses/); lifetime access, as-is"
expires = "Zenva: redeem within one year of the Humble purchase. Recent bundle pages give a date (e.g. 'Keys Expire. Please redeem before September 23, 2027')."
expiry_text = "(?i)redeem (?:your keys )?before ([A-Z][a-z]+ \\d{1,2}(?:st|nd|rd|th)?,? \\d{4})"
steps = [
  "Reveal the Zenva coupon on Humble (one per bundle tier bought). If Humble says 'Please try redeeming again later' or gives a lower tier's code, that is Humble's to fix: https://support.humblebundle.com/hc/en-us/requests/new",
  "Sign up or log in at https://academy.zenva.com/ (email, Google, Facebook or LinkedIn). Use one account for every coupon: accounts are per email.",
  "Empty the cart (https://academy.zenva.com/cart/), then open the add-to-cart link for the bundle and tier bought (see redeem.products, or Zenva's help article). Use the highest tier only: it includes the lower tiers.",
  "Proceed to Checkout; on the checkout page enter the coupon in the Redemption Code / Coupon Code field and apply it.",
  "Continue only if the order total is $0. Then tick the confirmation box if shown and click Checkout. No payment details are needed.",
  "The courses appear under Purchased Courses (https://academy.zenva.com/purchased-courses/). If checkout errored, look there first: it may have gone through.",
  "Redeem several bundles one at a time (one coupon per order).",
  "'Coupon does not exist' or a non-zero total means the wrong product is in the cart: empty it and retry with the link for the exact bundle and tier.",
]
special = [
  "The Complete Godot Software Bundle - ENCORE, Tier 3 (20 items): redeem two products separately, 3269281 (16 items) and 3339174 (4-item expansion).",
  "Stand with Ukraine Bundle (product 2668809) and Build Roblox Games 1-item (product 2892563): add to cart, then follow Zenva's general coupon steps (Coupon Code button above 'Your Order', Apply Coupon, check the deduction).",
  "The Humble Full-Stack Web Development / 2021-era bundles used a 'Click Here to Redeem your Zenva Code' link on the Humble page and a BUY NOW button on Zenva. The add-to-cart links below replace them.",
]

