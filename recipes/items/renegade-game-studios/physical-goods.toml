notes = """
Physical items in Renegade's Humble bundles: whole 'Physical Game' bundles
(deck-builders, Board Game All Stars, Garphill Games) and the physical
add-ons in the RPG bundles (dice sets and bags, journals, standees,
miniatures, GM screens, Sgt. Slaughter accessory pack, V:TM Rivals card
game and expansions). In the RPG bundles they are the items Humble typed
'game' among the PDFs; in the physical bundles every item. Redeemed with the
same coupon flow as the PDFs, plus a shipping address (US, Canada, Australia,
New Zealand only) and shipping paid at Renegade's checkout. The Power Rangers
RPG Core Rulebook (typed 'game' in its own bundle) is left on the vendor
route because the same machine name is a PDF in the Roll Big or Go Home
bundles.
"""

[redeem]
where = "the 'Click here to redeem your key' link on the Humble download page (renegadegamestudios.com product page)"
account = true
delivers = "the physical products, shipped by Renegade (shipping paid by the buyer)"
steps = [
  "Log in to (or create) a Renegade account: https://renegadegamestudios.com/login.php",
  "Open the 'Click here to redeem your key' link from the Humble download page and add the product to the cart.",
  "Enter the Humble key as the cart's Coupon Code and click Apply.",
  "Check out with a US, Canadian, Australian or New Zealand shipping address and pay the shipping shown.",
]

[install]
source = "vendor"
serial = "none"

[steam]
shortcut = false

