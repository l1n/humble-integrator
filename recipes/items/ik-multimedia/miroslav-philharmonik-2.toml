schema = 1
name = "Miroslav Philharmonik 2"
vendor = "ik-multimedia"
kind = "addon"
machine_names = ["miroslavphilharmonik2"]
verified = false
notes = """
Orchestral sample instrument (strings, woodwinds, brass, percussion, choirs) on the SampleTank engine; plug-in and standalone. No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = "Register the Humble serial on the IK account, then install from IK Product Manager (Software tab; sample content from the Sounds tab). Authorization happens in Product Manager."

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
bridge = "yabridge"
prefix = "audio-plugins"
notes = "No Linux build. Untested: Windows installer into the shared audio-plugins Wine prefix, bridged into a Linux DAW with yabridge."

[[sources]]
url = "https://www.humblebundle.com/software/ik-multimedia-presents-studio-essentials-pianos-bass-drums-cinematic-sounds-software"
