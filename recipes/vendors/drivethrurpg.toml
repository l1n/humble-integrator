schema = 1
name = "DriveThruRPG (tabletop RPG ebook store)"
kind = "route"
notes = """
Humble RPG book bundles whose ebooks are not Humble downloads but DriveThruRPG
products. Each Humble "key" is a unique DriveThruRPG URL; opening it while
logged in puts the product in the DriveThruRPG cart at $0, and after the $0
checkout the PDFs sit in the DriveThruRPG library for download. In the census
so far: "Humble RPG Bundle: Candela Obscura by Darrington Press & Friends"
(Oct-Nov 2026; "Keys are redeemable through DriveThruRPG"), whose items are
the Candela Obscura core book and third-party assignments by Darrington Press,
Beadle & Grimm, La Lionne Publishing, Nostromo's Reliquary, Aetherworks,
MargoMods and Shaeomar. Its three "(Demiplane Edition)" items are web-only
books read on Demiplane; they have item recipes under items/demiplane/.

Wave 4 added the other RPG bundles whose text sends keys to DriveThruRPG
("redeemable through DTRPG", "on the dtrpg.com website", "available through
the DriveThru RPG website", Humble's typo "DriveTrhuRPG"): Call of Cthulhu
ENCORE (Chaosium), the Complete Dune RPG Digital Megabundle (Modiphius),
Deadlands Reloaded Megabundle (Pinnacle), Warhammer RPG Starter Bundle
(Cubicle 7), The Witcher TTRPG (R. Talsorian), the ENNIE Awards bundle, and
Cyberpunk RED: Ready-to-Run Essentials ("redeemable through DTRPG and
Syrinscape website": Loke Battle Mats maps and R. Talsorian/Roll20
"Cross-Platform Bundles", which the item text says unlock the book on
DriveThruRPG and Demiplane and sheets on Roll20; its Syrinscape SoundSets and
SuperSyrin month have item recipes under items/syrinscape/, its StartPlaying
coupon under items/startplaying/).
The ENNIE bundle says "some on DriveThruRPG, and some with Paizo": its one
Paizo-published title (Pathfinder Player Core) has the item recipe
paizo/pathfinder-player-core; Paizo's own PDFs only reached DriveThruRPG in
August 2026, after that bundle.
By URL slug, because the census snapshot lacks the sentence: Roll Big or Go
Home RPG Megabundle (2025; a later snapshot says "The titles in this bundle
are available through DriveThruRPG", as does its Encore), Roll Big or Go Home
2 (2026; "The content of this bundle is redeemable through DTRPG and some PDF
files"), and Dungeon Master's Guild Top Content (2026; "redeemable through
the DriveThruRPG website", like the earlier Bestselling bundle with the same
items). 7th Sea RPG Collection (Nov 2024) says "redeemable on the Chaosium,
Inc. website", but Chaosium's own announcement says the bundle "adds the
titles direct to your personal DriveThruRPG library"; this recipe follows
Chaosium (single key for the whole bundle).

Mixed bundles: Roll Big or Go Home and The Witcher also have hb-drmfree items.
Vendor rules are per bundle, so those resolve here too; they are ordinary
Humble downloads that `hi apply` still fetches, and only the hb-key items
need the DriveThruRPG steps below.

Matched only by redemption text and bundle slugs (and keys by domain):
DRM-free RPG ebook bundles that are ordinary Humble downloads must stay on
the generic ebook route, and the publishers above also sell through other
channels, so there is no developers rule.

Library: DriveThruRPG keeps every purchase in the account's library with
re-downloads (and publisher updates). No public download API was found, so
fetching is by hand from the library page (not scriptable as far as known).
"""

[match]
domains = ["drivethrurpg.com", "dtrpg.com"]
key_names = ['drivethru ?rpg', '\bdtrpg\b']
redeem_text = [
  # "Keys are redeemable through DriveThruRPG." / "redeemable on the dtrpg.com website" /
  # "redeemable through DTRPG and Syrinscape website" / Humble's typo "DriveTrhuRPG"
  'redeem\w*[^.]{0,60}\b(drive ?t(hr|rh)u ?rpg|dtrpg)\b',
  # "The titles in this bundle are available through DriveThruRPG" (also "through:"),
  # "available through the DriveThru RPG website", and the ENNIE bundle's
  # "available through two partners: some on DriveThruRPG, and some with Paizo"
  # (its one Paizo title has an item recipe, paizo/pathfinder-player-core).
  'available\s+through[^.]{0,40}\b(drive ?thru ?rpg|dtrpg)\b',
]
# Bundles whose census snapshot lacks the redemption sentence (the live page had it
# later), and keys whose instructions may not name the site. URL slugs or order
# machine names (hyphen-free).
bundle_slugs = [
  '^candela-?obscura-?darrington-?press-?friends',
  # Roll Big or Go Home RPG Megabundle (2025), its Encore, and Roll Big or Go Home 2 (2026)
  '^roll-?big-?or-?go-?home',
  # Dungeon Master's Guild Top Content (Sept-Oct 2026)
  '^dungeon-?masters-?guild-?top-?content',
  # 7th Sea RPG Collection by Chaosium (Nov 2024): Humble says "Chaosium, Inc. website",
  # Chaosium says the titles go to the DriveThruRPG library (see notes)
  '^7th-?sea-?rpg-?collection-?chaosium',
]

[redeem]
where = "the unique DriveThruRPG URL shown for each item on the Humble download page"
account = true
delivers = "the ebooks (PDF) in the DriveThruRPG library, re-downloadable"
expires = "per bundle when stated (Cyberpunk RED Ready-to-Run: redeem before June 30th, 2027; Roll Big or Go Home 2: before June 25, 2027); otherwise check the Humble download page. Key.is_expired from Humble is authoritative."
expiry_text = '(?i)redeem(?:ed)? before ([A-Z][a-z]+ \d{1,2}(?:st|nd|rd|th)?,? \d{4})'
steps = [
  "Create or log in to a DriveThruRPG account first: https://www.drivethrurpg.com/login.php (use one account for every key).",
  "Open the unique URL for the item from the Humble download page.",
  "Proceed to checkout; the total should be $0. Complete it.",
  "The products are on the order page and in the account library; download the PDFs from there into the library folder.",
]

[download]
scriptable = false
how = "by hand from the DriveThruRPG library page after login"
notes = "No documented API for library downloads was found (not researched further)."

[library]
ebooks = "PDF (some products add print-friendly or form-fillable variants) per DriveThruRPG product"

[install]
source = "vendor"
serial = "none"

