  "tier2_gameaudiocollectionaccesstoover300000musictracksandsoundeffects",
  "tier3_gameaudiocollectionaccesstoover300000musictracksandsoundeffects",
]
verified = false
notes = """
Coupon codes for AudioHero download credits, chosen from the whole
~300,000-track music and SFX catalogue: Starter = 1 track, Prodigy = 50
downloads, Action Hero = 100 downloads (+ the Cinematic Immersion pack in
the 2025 bundle); the 2026 DRM-free bundle's Tier 1 = 1 track + The Final
Level SFX pack and Tier 2 = 25 downloads (Humble's text says "fifty (25)")
+ 10 packs; the 2026 Game Audio Collection's Tier 1/2/3 = 1 track / 10 / 1000
downloads. Humble's plan descriptions say "Licensed in perpetuity" and
AudioHero staff confirm Humble credits need no ongoing subscription.
Nothing to install; spend the credits before closing the account (credits
are lost on unsubscribe). Redeem as in vendors/audio-hero.
"""

[install]
source = "vendor"
serial = "none"

[steam]
shortcut = false

