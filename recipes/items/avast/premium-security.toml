notes = "Cybersecurity with Avast (2021) and PC Utility and Security Tools with Avast & Laplink (2023). Antivirus suite. 'Multi-Device': Windows, Mac and Android on one code (Humble 2021). macOS: install the native Avast Security app and enter the code under Menu > My subscriptions. Linux: no client. Windows: pointless under Wine. A background service, not something to launch from Steam. App bundle name is a glob, not confirmed."

