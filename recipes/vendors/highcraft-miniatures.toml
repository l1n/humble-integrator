schema = 1
name = "HighCraft Miniatures (3D-print STL miniatures)"
kind = "route"
item_kind = "content"   # STL / Lychee files for a library folder; nothing to install, no Steam entry
notes = """
HighCraft Miniatures sculpts fantasy tabletop minis (Grogs, Dagors, Pirate
Toads, Stag Goblins, Raily Dwarfs, Fuse/Koper skeletons, Rekan, Ger...). Its
Humble bundles are paid to "Mints Interactive Limited" (Humble's payee/split
name for both bundles below), and the miniatures are sold on MyMiniFactory
(store https://www.myminifactory.com/users/HighCraft), Gumroad
(highcraft.gumroad.com) and once on highcraftminiatures.com (now only a
contact page). Each miniature ships as STL unsupported, STL pre-supported
and a pre-supported Lychee scene (.lys), with universal bases of 25 to
60 mm.

Census bundles, all items with no Humble delivery icon:
- "Humble 3D Printable Adventure Bundle" (Nov-Dec 2021, 50 minis, 5e stat
  blocks): "ATTENTION: A single key will be provided to redeem content in
  your bundle." The page says only "Redeem your keys" and names no site;
  items link to highcraftminiatures.com.
- "85 Miniatures Designed for Easy 3D Printing" (Feb-Mar 2025, 83 items):
  no key wording, no DRM-free wording. Every item links to its MMF object
  page (IDs in [mmf_objects]). Delivery is therefore unknown: a key for MMF
  or Humble downloads. 15 machine names (grog*, dagor*, rekan*) also appear
  in the 2021 bundle.
- "3D Printable Miniatures for Board Games & Wargaming" (Jan 2021): no
  archived capture with item data; claimed by slug in case one turns up.

The 2021 key was redeemed at http://redeem.highcraftminiatures.com/, which
emails a MyMiniFactory link; the files then appear in the MyMiniFactory
Library under "Objects shared with me" (Humble article 4410689415195).

Matching is deliberate. Census items match on the developer name
"HighCraft Miniatures" and on the bundles' URL slugs. Not on "Mints
Interactive Limited": in a real account, a downloadable Humble subproduct
arrives with its payee as developer and the order's machine_name as slug.
If the 2025 bundle turns out to be Humble downloads, those must keep
falling through to generic/files. (Items on a vendor route still get their
Humble downloads fetched by `hi apply`.) Keys match on the HighCraft/bundle names.
"""

[match]
developers = ["HighCraft Miniatures", "Highcraft Miniatures", "High Craft Miniatures", "HighCraft"]
domains = ["highcraftminiatures.com", "highcraft.gumroad.com", "myminifactory.com/users/highcraft"]
key_names = [
  "high ?craft",
  "3d printable adventure",
  "fantasyminiaturesfor3dprinting",
  "85 ?miniatures ?designed",
  "3d printable miniatures for board games",
]
bundle_slugs = [           # URL-slug form only (census); an account's order slug is the product machine_name
  '^3d-printable-adventure-software',
  '^85-miniatures-designed-for-easy-3d-printing',
  '^3d-printable-miniatures-for-board-games-wargaming',
]

[redeem]
where = "https://www.humblebundle.com/home/keys"
account = true
delivers = "STL miniatures: unsupported STL, pre-supported STL and a pre-supported Lychee scene (.lys) per model, plus universal bases"
expires = "No deadline on either bundle page. Humble's terms (Dec 2024) expire unrevealed/unclaimed keys 3 years after purchase, so the 2021 key may already be gone; Key.is_expired from Humble is authoritative."
steps = [
  "Open the order on Humble. If its items show Download buttons (possible for the 2025 '85 Miniatures' bundle), there is no key: download them from Humble into <library>/3d-print/highcraft-miniatures/.",
  "Otherwise reveal the bundle's single key (Keys & Entitlements). It covers every miniature in the tier you paid for. Read the instructions Humble shows next to it: they name the site it is redeemed on.",
  "If that site is MyMiniFactory (most likely, HighCraft's store is https://www.myminifactory.com/users/HighCraft): sign in to or create a free MMF account (https://www.myminifactory.com/register/), redeem the key as instructed, then download each miniature from your MMF Library. Details: vendors/myminifactory.",
  "If the instructions name another store (highcraftminiatures.com, https://highcraft.gumroad.com), follow them there. If the site no longer works, ask HighCraft through the contact form on https://highcraftminiatures.com.",
  "Save each miniature under <library>/3d-print/highcraft-miniatures/<miniature>/ and unpack its archive(s) with 7z.",
]

[install]
source = "vendor"
serial = "none"
file = "*.zip"
unpack = "7z"
notes = "Files only: no installer. Pick the pre-supported STL or the .lys scene for resin printers; the unsupported STL is for adding your own supports."

[download]
scriptable = "possible, unverified"
notes = """
If the purchase ends up in an MMF Library, the MyMiniFactory API (OAuth;
see vendors/myminifactory [download]) returns each object's
archive_download_url. [mmf_objects] maps the 2025 bundle's machine names to
the MMF objects Humble linked (rockbaseset3models had no link). The 2021
bundle linked only to highcraftminiatures.com: its 15 shared machine names
map through this table, the other 35 need an MMF search by miniature name.
"""

