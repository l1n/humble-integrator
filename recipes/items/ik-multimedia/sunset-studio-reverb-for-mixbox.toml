schema = 1
name = "Sunset Studio Reverb Collection for MixBox"
vendor = "ik-multimedia"
kind = "content"
machine_names = ["sunsetstudioreverbcollectionformixbox"]
requires = ["ik-multimedia/mixbox-se"]
verified = false
notes = """
Five MixBox modules derived from T-RackS Sunset Sound Studio Reverb: Chamber, Live Room, ISO Booth, Plates 1 and 2, Spring Reverb. Loads in MixBox. No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = "Register the Humble serial on the IK account, then install from IK Product Manager (Software tab; sample content from the Sounds tab). Authorization happens in Product Manager."

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
prefix = "audio-plugins"
notes = "Installs into the host plug-in's Windows install in the shared audio-plugins prefix (untested)."

[[sources]]
url = "https://www.humblebundle.com/software/ik-multimedia-presents-audio-master-suite-software"
claim = "'a set of 5 new modules for MixBox derived from ... T-RackS Sunset Sound Studio Reverb' (census)"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/29332171355675-IK-Multimedia-Redemption-Instructions-EULA"
claim = "register at ikmultimedia.com/registration; IK Product Manager: Software tab > Install, Sounds tab > Install"
