verified = false
notes = """
GameDev.tv asset pack, not a course: 21 starships and 100+ modular parts in 9 colour variations; full commercial licence.
It is redeemed like every GameDev.tv coupon (see vendors/gamedev-tv). It then
appears in My Library, and its page lists the downloadable files. Download
them into the library folder. Nothing to install and no Steam entry: the
files are imported by hand into Unity, Unreal Engine 5, Godot, Blender (or any engine via FBX/glTF).
"""

[install]
source = "vendor"
serial = "none"
