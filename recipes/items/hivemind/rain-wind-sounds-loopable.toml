schema = 1
name = "Rain & Wind Sounds (Loopable)"
vendor = "hivemind"
kind = "content"
publisher = "Hivemind"
machine_names = [
  "rainwindsoundsloopable_hivemind",
]
verified = false
notes = """
A Hivemind sound pack for games (10 Loopable Ambiances),
in both Hivemind mixed bundles. The Massive bundle's text says it is
"available DRM-Free"; the Game Dev Asset Mega Bundle lists it as a DRM-free
download, while the Massive bundle's item data shows a key (census delivery:
gamedev:hb-drmfree, massive:hb-key). Fetch the Humble download into the
library folder; if Humble also shows a key, it is a Fab code (inference) and
redeems like the bundle's other keys.
"""

[install]
source = "humble"
serial = "none"
notes = "Audio files (loops / sound effects) for use in any engine; nothing to install."

[library]
files = "the pack's audio files as Humble delivers them (format not stated on the bundle pages)"

[steam]
shortcut = false

