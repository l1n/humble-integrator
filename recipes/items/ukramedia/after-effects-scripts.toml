name = "Ukramedia smartREKT, smartL3RD and Controlit (After Effects scripts/templates)"
vendor = "ukramedia"
kind = "content"
machine_names = ["smartrekt", "smartl3rd", "controlit"]
verified = false
notes = """
Professional Filmmaking Tools (Dec 2019). smartREKT: responsive rectangle
tool script for After Effects; smartL3RD: keyframe-less modular lower-third
template built with smartREKT (30 presets); Controlit: one-click script that
turns layer properties into expression controls. All need the user's own
Adobe After Effects (macOS/Windows). Redemption is undocumented (see
vendors/ukramedia). Grouped because they install the same way: unzip into
After Effects' Scripts/ScriptUI Panels. Controlit has since been replaced
by Ukramedia's 'Smart Controls'.
"""

