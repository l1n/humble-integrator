schema = 1
name = "Corel PaintShop Pro (2019 / 2020 / 2021 / 2022 / 2023)"
vendor = "corel"
kind = "app"
machine_names = ["paintshoppro", "paintshoppro2020", "paintshoppro2021", "paintshoppro2022", "paintshoppro2023"]
verified = false
notes = "Older editions: 'paintshoppro' is PaintShop Pro 2019 (Professional Photography 2018: trial installer from paintshoppro.com + serial; Painter - Create With Confidence 2019 + Encore: PaintShop Pro Ultimate, one download whose Autorun installs PSP, AfterShot 3, Painter Essentials 6, GRFX Studio and PhotoMirage Express, each with its own serial from the download page); 'paintshoppro2020' is PSP 2020 (Be a Creative Superhero!, 2020: serial + user name in the installer, Corel account registration at first launch). Perpetual, two devices. Windows-only photo editor; each version is a Humble download + its own serial; install only the newest owned. No Mac/Linux build; CrossOver rates PaintShop Pro 2023 'Will Not Install' on Mac (24.0.7) and nothing newer is rated, so expect trouble under Wine."

[install]
source = "humble"
file = "*PaintShop*Pro*"
serial = "per-product"
notes = "Serial in the installer's serial page (Corel MSI-based setup; see vendor driver_notes)."

[launch]
find = "C:/Program Files*/Corel/*PaintShop Pro 20*/*PaintShop Pro*.exe"
notes = "Inferred: 'Corel PaintShop Pro.exe' in 'Corel PaintShop Pro <year> (64-bit)'."

[steam]
shortcut = true
title = "PaintShop Pro"
steamgriddb = "PaintShop Pro"

[[sources]]
url = "https://www.codeweavers.com/compatibility/search?name=corel"
claim = "CodeWeavers: entries only up to Painter 2019, VideoStudio X3, PaintShop Pro 2023; none for the 2022 versions"

[[sources]]
url = "https://www.codeweavers.com/compatibility/crossover/corel-paintshop-pro-2023"
claim = "PaintShop Pro 2023: 'Will Not Install' on CrossOver 24.0.7 Mac (search snippet)"
