skip_reason = "Needs system-wide keyboard/mouse hooks on real Windows PCs; useless inside a Wine prefix. Keep the key for a real Windows PC."
notes = "Stardock Desktop Essentials (2023). Shares one keyboard and mouse across several Windows PCs over the network. It needs system-wide input hooks on each PC; inside a Wine prefix it would only see Wine's own windows (native alternatives on macOS/Linux: Input Leap, Barrier, Synergy). (Multiplicity 3 in the 2018/2020 bundles was a Steam key.) Installer from the Humble download page; key + email in the 'Enter Product Key' dialog (see vendors/stardock)."

