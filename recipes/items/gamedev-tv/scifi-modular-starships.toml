notes = "The product page lists these files: (UNREAL)_*.zip; (UNITY_URP)/(UNITY_HDRP)/(UNITY)*.unitypackage; (GODOT)*.zip; (glTF)*.zip; (FBX)*.zip; (BLENDER)_*.blend; 'GameDev.tv General Asset License 2.0.txt'. Fetch all of them, or only the engines the user picked."

