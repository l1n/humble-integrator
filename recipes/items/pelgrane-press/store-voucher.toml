steps = [
  "Nothing to do: the voucher expired on 2021-12-31.",
  "Historical flow: add a 13th Age print book to the cart at the Pelgrane Press store, enter the voucher code from the Humble download page at checkout, see $25 deducted.",
]

[install]
source = "vendor"
serial = "none"

[steam]
shortcut = false

