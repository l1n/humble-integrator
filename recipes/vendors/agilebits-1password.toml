schema = 1
name = "AgileBits (1Password Families & Teams)"
kind = "route"
service = true        # account subscription; apps are free downloads
notes = """
Humble Software Bundle: Work Remote (Apr-May 2020): 1Password Families &
Teams: a 6-month Families and a 6-month Teams subscription, 'Credit card
activation required' (bundle text): the 1Password account takes a card
and bills after the free period unless cancelled. No Humble article was
found. 1Password has native apps for macOS, Windows and Linux plus browser
extensions; nothing for Steam. The 2020 offer is presumably expired.
"""

[match]
developers = ["AgileBits", "1Password"]
domains = ["1password.com"]
key_names = ['1password']

[redeem]
where = "a new 1Password Families / Teams account via the link or code on the Humble download page"
account = true
delivers = "6 months of 1Password Families and 6 months of 1Password Teams"
expires = "bundle ended May 2020; presumably expired"
steps = [
  "Reveal the code/link on the Humble download page and follow it (no Humble article found).",
  "Create the 1Password Families (and/or Teams) account; a credit card is required at activation and is billed after the free months unless the subscription is cancelled.",
  "Install the native 1Password app for macOS or Linux, or the browser extension.",
]

[download]
scriptable = false
how = "nothing to download from the code; apps are free downloads"

[install]
source = "vendor"
serial = "account"

[platforms.macos]
runner = "native"
[platforms.linux]
runner = "native"

[[sources]]
url = "https://www.humblebundle.com/software/work-remote-software"
claim = "'1Password Families & Teams: 6-month Families & 6-month Teams subscription. Credit card activation required.'; developer AgileBits; Windows/Mac/Linux (census)"
