schema = 1
name = "Ashampoo 3D CAD Professional 12"
vendor = "ashampoo"
kind = "app"
machine_names = ["ashampoo3dcadprofessional12"]
verified = false
notes = "2025 Humble bundle. Installer is ~2 GB (cdn1.ashampoo.net/ashampoo/2360/ashampoo_3d_cad_professional_12_12.0.0.exe). Owning several versions of the same line: the newest is enough, the older keys can stay unrevealed."

[install]
source = "vendor"
url = "https://www.ashampoo.com/ashampoo_3d_cad_professional_12.exe"
file = "ashampoo_3d_cad_professional_12*.exe"
args = []
serial = "per-product"
notes = "Key goes into the installer's key page ('Activate now!') or the program's 'Enter key manually' dialog. Redirector URL observed working Oct 2026 (undocumented)."

[launch]
exe = 'C:\Program Files\Ashampoo\Ashampoo 3D CAD Professional 12\program\CAD.exe'
find = "C:/Program Files*/Ashampoo/Ashampoo 3D CAD Professional 12/program/CAD.exe"
notes = "Path read from the installer's Inno header (DefaultDirName + program\\CAD.exe); not yet seen on disk."

[steam]
shortcut = true
title = "Ashampoo 3D CAD Professional 12"
steamgriddb = "Ashampoo 3D CAD Professional 12"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/5626237932059"
claim = "Humble: 3D CAD keys are entered in setup / the activation dialog ('Enter key manually')"

[[sources]]
