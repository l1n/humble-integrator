schema = 1
name = "PortraitPro 19 (Standard / Studio / Studio Max)"
vendor = "anthropics"
kind = "app"
machine_names = ["portraitpro19", "portraitprostudio19", "portraitprostudiomax19"]
verified = false
notes = "2023 Humble bundle. Three editions of the same product, each its own token and installer; Studio adds RAW and plug-ins, Studio Max adds batch mode. Install only the highest edition owned. v19 installers are only reachable through the redeem email / License Manager links (v19 paths on the CDN are not public)."

[install]
source = "vendor"
file = "PortraitPro*Setup*.exe"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
serial = "per-product"
notes = "Pick the installer whose edition matches the token (Standard / Studio / Studio Max). The token is typed into the app at first launch, not the installer."

[launch]
find = "C:/Program Files*/PortraitPro*19*/PortraitPro*.exe"

[steam]
shortcut = true
title = "PortraitPro 19"
steamgriddb = "PortraitPro 19"

[platforms.macos]
runner = "native"
file = "*.pkg"
app_find = "/Applications/PortraitPro*.app"
notes = "v19 predates the Apple Silicon build (inferred: runs under Rosetta)."

[[sources]]
url = "https://www.anthropics.com/portraitpro/redeem/"
claim = "redeem form: activation token + name + email; download links are emailed"

[[sources]]
url = "https://www.anthropics.com/support/activating/"
claim = "token entered in the app on first launch; online activation, or manual activation via fingerprint + key file"
