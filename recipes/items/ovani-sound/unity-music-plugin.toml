schema = 1
name = "Unity Music Plugin"
vendor = "ovani-sound"
kind = "content"
machine_names = ["unitymusicplugin", "unityaudioplugin"]
verified = false
notes = """
Music integration for Unity: switch song intensity, pick songs or play randomly, seamless loops, from an inspector UI. Includes Music Sampler Mixtape Vol. 1 and a video start-up tutorial. 'Unity Audio Plugin' (2023 bundles) is the same product under its old name; the store handle is still unity-audio-plugin. A game-engine add-on, not a system install: it goes into a Unity project (Requires Unity 2021.3+ for the music, ambience and footsteps plugins), by hand, per project; no Steam entry. Humble lists Windows/macOS/Linux icons on some bundles; the plugin is engine code and presumably runs wherever the engine runs (inference).
"""

[install]
source = "vendor"
serial = "none"
notes = """
Download from the Ovani order after redeeming the Humble coupon, keep the archive in the library (audio/ovani-sound/plugins/), then: Import the package into the project (Assets > Import Package > Custom Package, or drag it into the Project window; inference). Package format not checked.
"""

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "native"

[[sources]]
url = "https://ovanisound.com/products/unity-audio-plugin"
claim = "product page: Unity Music Plugin features and engine requirement"

