schema = 1
name = "Magpie Games (physical RPG goods via magpiegames.com)"
kind = "route"
service = true        # physical goods shipped by post: nothing to download or install
notes = """
Humble Physical RPG Bundle: Urban Shadows Physical Collection by Magpie
Games (Oct-Nov 2026; 'Physical item with limited quantity'). The items are
physical products: Urban Shadows 2nd Edition (printed core book), MC Screen +
Campaign Notepads, Dice Pack and Dice Tray. The Humble keys are coupon codes
for magpiegames.com that zero the product price at checkout; shipping is paid
separately there. Kind is 'service' because nothing digital arrives: the
tool can only show the steps (and the user must enter a postal address and
pay shipping themselves).

Humble Physical Tabletop Game Bundle: Avatar Legends 20th Anniversary
Physical RPG Bundle (Oct-Nov 2025, games category, $49 minimum, ACLU): six
hb-key items (Starter Set, GM Screen, Dice Pack, Journal Pack, Cloth Map &
Pai Sho Tile, Deluxe Dice Bag), all physical. "Keys are redeemable through
Magpie Games' website. Shipping is paid on Magpie Games' website upon
redemption" (estimates US $15, UK $19, CAN $25, EU $29). Humble's article
puts one product, accessories-bundle-avatar-legends, in the cart and the
coupon zeroes it. So the six keys are most likely one coupon for the whole
set; the article does not say whether each item has its own code
(inference).

Matched by these bundles' slugs only: Magpie Games also publishes DRM-free
ebook bundles on Humble that must stay on the generic download routes, and
the item machine names (e.g. urbanshadows2ndedition) could recur as ebooks.
Humble's 'Magpie Games Classic Indie RPG Physical Book Bundle' (May 2026)
used the same coupon flow ('Keys are redeemable on the Magpie site';
shipping US $11, UK $15, Canada $19, Europe $23, rest of world $29): five
physical books (Our Last Best Hope + Expansion, Epyllion + Encyclopedia
Draconica, The Play's The Thing). Wave 4 added it, the 'Best of Humble
Bundle' re-run of the Avatar Legends 20th Anniversary bundle, and a
redemption-text rule for "redeemable ... Magpie" sentences (only physical
Magpie bundles use them in the census; Magpie's digital books on Humble are
DRM-free downloads or DriveThruRPG keys).
'Best of Magpie Games' (March-April 2024) is a DRM-free ebook bundle whose
top tier added a physical Avatar Legends Starter Set: that one item has the
item recipe magpie-games/avatar-legends-starter-set-physical.
"""

[match]
# URL slug (urban-shadows-physical-collection-books) or a key's bundle machine name (hyphen-free)
bundle_slugs = [
  '^urban-?shadows-?physical-?collection',
  '^avatar-?legends-?20th-?anniversary-?physical',   # URL slug and order machine_name (avatarlegends20thanniversaryphysicalrpgbundle_bundle)
  # Wave 4: the "Best of Humble Bundle" re-run (best-humble-bundle-avatar-legends-20th-anniversary-physical-rpg-bundle)
  # and the Classic Indie RPG Physical Book Bundle (May 2026)
  '^best-?humble-?bundle-?avatar-?legends-?20th-?anniversary-?physical',
  '^magpie-?games-?classic-?indie-?rpg-?physical',
]
# "Keys are redeemable through Magpie Games' website." / "Keys are redeemable on the Magpie site."
redeem_text = ['redeem\w*[^.]{0,40}\bmagpie\b']
domains = ["magpiegames.com"]

[redeem]
where = "the product page for the tier bought on magpiegames.com, then its checkout"
account = false
delivers = "the physical items, shipped by Magpie Games (shipping paid by the buyer)"
expires = "not stated; physical stock is limited, so redeem promptly"
tier_products = [
  "Urban Shadows $39 tier: https://magpiegames.com/collections/urban-shadows/products/core-book-urban-shadows-1",
  "Urban Shadows $59 tier: https://magpiegames.com/products/urban-shadows-physical-collection-humble-bundle",
  "Avatar Legends 20th Anniversary ($49): https://magpiegames.com/products/accessories-bundle-avatar-legends",
  "Classic Indie RPG Physical Book Bundle: https://magpiegames.com/products/classic-indie-bundle",
  "Best of Magpie Games (2024) physical Avatar Legends Starter Set: https://magpiegames.com/products/avatar-legends-the-roleplaying-game-starter-set",
]
steps = [
  "Open the product page for the bundle and tier bought (see tier_products) and add the item to the cart.",
  "At checkout enter the coupon code from the Humble download page; it only works with that product in the cart.",
  "The discount removes the product cost; pay the remaining shipping cost and enter the postal address.",
]

[download]
scriptable = false
how = "nothing to download: physical goods"

[install]
source = "vendor"
serial = "none"

