notes = "Loop-based music production; 2024 edition from the 2025 VEGAS bundle, 2025 edition from the 2026 'Create Magic with MAGIX' bundle. Install only the newer one if both are owned. Windows 10/11 64-bit. Soundpool coupons are redeemed inside its Store tab."

[install]
