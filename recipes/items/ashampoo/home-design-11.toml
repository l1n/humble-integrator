kind = "app"
machine_names = ["ashampoohomedesign11"]
verified = false
notes = "2026 'Build Your Dream Home' Humble bundle (redeem before 2027-09-15). Redirector resolves to cdn1.ashampoo.net/ashampoo/1167/ashampoo_home_design_11_11.0.0.exe. Owning several versions of the same line: the newest is enough, the older keys can stay unrevealed."

[install]
source = "vendor"
url = "https://www.ashampoo.com/ashampoo_home_design_11.exe"
file = "ashampoo_home_design_11*.exe"
args = []
serial = "per-product"
notes = "Key goes into the installer's key page ('Activate now!') or the program's 'Enter key manually' dialog. Redirector URL observed working Oct 2026 (undocumented)."

[launch]
exe = 'C:\Program Files\Ashampoo\Ashampoo Home Design 11\program\CAD.exe'
find = "C:/Program Files*/Ashampoo/Ashampoo Home Design 11/program/CAD.exe"
notes = "Path read from the installer's Inno header (DefaultDirName + program\\CAD.exe); not yet seen on disk."

[steam]
shortcut = true
title = "Ashampoo Home Design 11"
steamgriddb = "Ashampoo Home Design 11"

