verified = false
notes = """
From the games bundle 'Fantasy Grounds: Ultimate GM Kit for Pathfinder'
(Dec 2021), where the census lists it with publisher 'Paizo' (so no
SmiteWorks rule claims it). Its Pathfinder content keys go to
vendors/smiteworks and the Steam keys to Steam. Same situation as the
Ultimate trial in smiteworks/fantasy-grounds-vtt: since FG VTT became free
the licence/subscription keys are moot. Existing subscriptions are not
cancelled automatically (cancel under Store > Order History if one was
started).
"""

