schema = 1
name = "Voucher Code for Producer Planet"
vendor = "producer-planet"
kind = "service"
machine_names = ["producerplanetvoucher"]
verified = false
notes = """
A one-transaction coupon for the MAGIX content store Producer Planet ($19.99 in The Beat Goes On; amounts vary by bundle, usually $9.99 or $19.99). Not a product: the user chooses what to spend it on, so nothing is fetched automatically. Unused value is lost; dearer items need payment for the rest. Bundles: The Beat Goes On, VEGAS Pro Even More Creative Freedom (and REBundle), VEGAS Pro 2022, VEGAS Pro Discover Your Endless Freedom. Vouchers expire (The Beat Goes On: December 31st, 2020); the date is on the download page.
This item recipe also takes the voucher out of vendors/magix for the VEGAS Pro 2022 / Discover bundles, where MAGIX's developer rule caught it.
"""

[install]
source = "vendor"
serial = "none"

[steam]
shortcut = false

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/360013107874-Voucher-Code-for-Producer-Planet-Redemption-Instructions"
claim = "Voucher Code for Producer Planet: one-transaction coupon ($9.99/$19.99 by bundle), no credit balance, vouchers expire, download under MY PRODUCTS"
[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/360033673034-Humble-Software-Bundle-The-Beat-Goes-On-Voucher-Code-for-Producer-Planet-instructions"
claim = "The Beat Goes On voucher: $19.99 off one item, redeem by December 31st 2020"
[[sources]]
