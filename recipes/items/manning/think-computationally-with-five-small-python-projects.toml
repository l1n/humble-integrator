schema = 1
name = "Think Computationally with Five Small Python Projects (liveProject series)"
vendor = "manning"
kind = "service"
machine_names = ["thinkcomputationallywithfivesmallpythonprojectsliveproject", "liveprojectthinkcomputationallywithfivesmallpythonprojects"]
verified = false
notes = """
A Manning liveProject: guided hands-on project work done in the browser on liveproject.manning.com. Web-only; nothing to download or install, no Steam entry.
Humble bundles: Code Like a Pro (2021), Programming Bootcamp (2022), Machine Learning: Zero to Hero. By Ana Bell.
The Humble item is a Manning code: redeem it as vendors/manning describes (manning.com/humble-bundle, or dashboard > Register Bundle when signed in).
In the older bundles without delivery icons (Technology Essentials for Business; Machine Learning: Zero to Hero, by inference from its 'liveVideo!'/'liveProject!' items and 'access keys' text) the code was a checkout discount code instead: add the title to the cart on manning.com, enter the code in 'Discount Code', Apply, check out at $0. Whether the old codes still work is unknown.
"""

[install]
source = "vendor"
serial = "none"

[steam]
shortcut = false

