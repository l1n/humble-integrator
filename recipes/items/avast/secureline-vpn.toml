schema = 1
name = "Avast SecureLine VPN (Multi-Device, 1 year)"
vendor = "avast"
kind = "app"
machine_names = ["avastsecurelinevpnmulti-device_1year"]
verified = false
notes = "Cybersecurity with Avast (2021) and PC Utility and Security Tools with Avast & Laplink (2023). VPN service. macOS: native app (2023 article: macOS 10.12-12); Linux: no client (a VPN inside Wine would not route the system's traffic). A background service, not something to launch from Steam. App bundle name is a glob, not confirmed."

[install]
source = "vendor"
url = "https://www.avast.com/secureline-vpn"
serial = "account"

[steam]
shortcut = false

[platforms.macos]
runner = "native"
app_find = "/Applications/Avast SecureLine*.app"

[platforms.linux]
runner = "none"
notes = "No Linux client; use the subscription on a Mac, Windows PC or phone."

[[sources]]
