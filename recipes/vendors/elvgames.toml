schema = 1
name = "ElvGames"
kind = "route"
notes = """
Small asset seller (pixel-art tilesets, characters, monsters, VFX, UI and
music packs for Unity, Unreal, Godot, GameMaker, RPG Maker...) with its own
store at elvgames.com and itch.io shops (elvgames.itch.io, elv-games.itch.io).

Deliberately matches nothing. ElvGames' own Humble bundles redeem on
itch.io, so vendors/itch-io claims them (also the Ultimate Top Down
Adventure Assets Bundle, Oct 2025: "All keys can be redeemed on the ElvGames
website", every item linking to elvgames.itch.io):
- Complete 2D Game Assets Bundle (Apr-May 2025, 90 keys): "Content is
  redeemed through ElvGames's website" means its itch.io store (all items
  link to elv-games.itch.io; GameFromScratch: "The assets are all redeemed on
  the Itch.io store"). An earlier version of this recipe guessed elvgames.com
  discount codes; nothing supports that.
- Ultimate Farming RPG Assets Bundle (May 2026, one key): "All keys can be
  redeemed on the ElvGames Itch.io website".
ElvGames packs inside GameDev Market bundles follow those bundles
(vendors/gamedev-market). A developer-name rule would wrongly pull those, so
there is none; and no domain/key-name rule either, so extracted keys that
mention elvgames.itch.io resolve to vendors/itch-io.

Seller notes for the itch.io claims: ElvGames offers Humble buyers one page
with everything (elvgames.itch.io/humble-bundle-game-assets: a single 'Game
Assets' zip plus the music, 5+ GB; 404 by Oct 2026) or per-pack claims,
which keep receiving updates.
"""

