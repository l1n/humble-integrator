schema = 1
name = "Flame Painter 4"
vendor = "escape-motions"
kind = "app"
machine_names = ["flamepainter4", "flamepainter4nowincludesjapanese"]   # 2020 Natural Digital Painting Kit (key), 2021 Paint and Draw (key + DRM-free)
verified = false
notes = "Also in 'Natural Digital Painting Kit' (2020, activation code only) and 'Paint and Draw' (2021): there the Humble code is redeemed at escapemotions.com/community/humblebundle, the build downloads from the Escape Motions account, and the installer asks for e-mail + registration key. 2023 'Become a Painting Pro with Rebelle 5' bundle: Humble serves Windows and Mac DRM-free builds. Particle-brush painting. Activates by Community-account login at first launch."

[install]
source = "humble"
file = "Flame Painter 4*"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
serial = "account"
notes = "Same build is downloadable from the Escape Motions account (My Account > Purchases) once redeemed."

[launch]
find = "C:/Program Files*/**/Flame Painter*.exe"
notes = "Exe name inferred from the installer naming (Rebelle 8 installs 'Rebelle 8.exe')."

[steam]
shortcut = true
title = "Flame Painter 4"
steamgriddb = "Flame Painter 4"

[platforms.macos]
runner = "native"
file = "*.dmg"
app_find = "/Applications/Flame Painter 4*.app"

[[sources]]
url = "https://www.escapemotions.com/community/humblebundle"
claim = "Humble redeem page ('Humble Software Bundle: Become a Painting Pro'): one code at a time, email verification"

[[sources]]
url = "https://www.escapemotions.com/products/flamepainter/documents/Flame_Manual_v.4.1.pdf"
claim = "Flame Painter 4: log in with the Community account on first launch; brushes via Brushes panel or library folder"

[[sources]]
url = "https://www.escapemotions.com/products/rebelle/manual/latest/getting-started/installing/"
claim = "installers 'Rebelle N.exe/.dmg'; installs to Program Files"
[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/360043631833-Flame-Painter-4-instructions"
claim = "older bundles: redeem the activation code at escapemotions.com/community/humblebundle, log in/create an account, download, enter e-mail + registration key during install"
