schema = 1
name = "VoiceBot Pro"
vendor = "binary-fortress"
kind = "app"
machine_names = ["voicebotprostandard"]
verified = false
notes = "2023 Binary Fortress Desktop Software Bundle ('Pro Standard' licence). Voice commands that send keys/macros to games. Under Wine it can only reach programs in its own prefix (Steam/Proton games each get their own), so no Steam shortcut."

[install]
source = "vendor"
url = "https://www.voicebot.net/Download/"
file = "VoiceBotSetup*.exe"
args = ["/VERYSILENT", "/LAUNCHAFTER=0", "/LKEYALL={key}"]
serial = "per-product"
notes = "{key} = the user's own revealed Humble key, passed to the documented /LKEYALL switch."

[launch]
exe = 'C:\Program Files\VoiceBot\VoiceBot.exe'
notes = 'Default folder {commonpf}\<Product> read from the installer; not yet seen in a prefix.'

[steam]
shortcut = false

[[sources]]
url = "https://www.displayfusion.com/KB/SilentInstallation"
claim = "Inno Setup switches incl. /VERYSILENT /DIR= /LKEYUSER= /LKEYALL= /LAUNCHAFTER=0 /MERGETASKS=; DisplayFusion adds /STARTUPUSER /STARTUPALL /CONTEXTMENU=0 /NOPREREQS=1"

[[sources]]
url = "https://www.displayfusion.com/FAQ/"
claim = "key entered in the installer, or later in Settings > License Key; no key = 30-day trial"

[[sources]]
url = "https://www.voicebot.net/Download/"
claim = "download page"
