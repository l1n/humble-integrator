Video courses by Penny de Byl (Holistic3D) and Michael Bridges, sold on Humble
as Packt courses (publisher Packt) in "Game Development - Mega Bundle" (June 2026,
"the latest Game Development Mega Bundle by Packt"; keys expire, redeem before
July 13, 2027) and, for eleven of them, in "Becoming a C# and Unity Game
Developer" (a Packt bundle the Packt route already claims). Each key is a Packt
voucher (inference: same publisher, same courses and the same 'Keys expire'
wording as the other Packt bundles; the Mega Bundle's text does not name the
redemption site and Humble has no article for it). This recipe points at
vendors/packt so the redemption steps, library layout and expiry handling are
Packt's.

The game-development-mega-bundle's other courses (3D Tudor, Eduonix, David
Nixon, Codestars, Ron Erez) are also Packt-published; they are not claimed here.
The cleanest long-term fix is a bundle_slugs entry for
'^game-development-mega-bundle' in vendors/packt.toml (left to that file's owner).

Nothing to install and no Steam entry; course videos stream in the Packt
library (offline download only if Packt offers it for the redeemed course).
"""

