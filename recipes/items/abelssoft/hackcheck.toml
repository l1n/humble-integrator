schema = 1
name = "Abelssoft HackCheck"
vendor = "abelssoft"
kind = "app"
machine_names = ["hackcheck"]
verified = false
notes = "2022 'Entertainment, Privacy & PC Health' bundle (Humble installer + key). Watches e-mail addresses/accounts for appearing in data breaches; Windows tray app (.NET 4.8 WPF)."

[install]
source = "humble"
file = "*.exe"
args = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-"]
serial = "per-product"

[launch]
find = "C:/Program Files*/*/Program/HackCheck.exe"
notes = "{commonpf}\\<Product>\\Program\\<exe> per the current installer's Inno header; the 2022 Humble build may differ."

[steam]
shortcut = true
title = "HackCheck"
steamgriddb = "Abelssoft HackCheck"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/5873424950427"
claim = "Abelssoft: install from the Humble download; first launch asks for the 20-digit key, then name + email, 'Get free unlock mail now', click the e-mailed link"

[[sources]]
url = "https://www.abelssoft.de/HackCheck-setup.exe"
claim = "current installer (Inno header inspected)"
