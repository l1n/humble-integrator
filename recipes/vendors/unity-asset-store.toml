schema = 1
name = "Unity Asset Store"
kind = "route"
notes = """
Redemption route, not a publisher: every Humble item whose key is a Unity
Asset Store voucher, whoever made the asset (Synty, Hivemind, Meshingun,
Leartes, ARTnGAME, PolySquid, Befour, Gabriel Aguiar, QuadArt, Procedural
Worlds, ...). Bundles say so in their redemption text ("Redeemable on Unity
Asset Store website", "Keys are redeemed through Unity Store website",
"The remaining items are redeemed on Unity") or link to
assetstore.unity.com/humble-bundle-redemption.

What the voucher unlocks: an Asset Store licence (entitlement) in the Unity
organization chosen at redemption. Nothing is downloaded from Humble and
nothing is installed system-wide. The assets appear under "My Assets" on
assetstore.unity.com and in the Unity Editor (Window > Package Manager >
My Assets), where they are downloaded and imported per project. Unity's
help page says one code activates all of that code's content; Humble's
newer bundles show one key per item, so expect anything from one code per
bundle/tier to one per asset.

Library folder: the tool cannot fetch Asset Store packages itself (there is
no public download API; downloads happen inside the Editor). Once the user
has downloaded them in the Editor, the .unitypackage files sit in the
Editor's asset cache (macOS ~/Library/Unity/Asset Store-5.x, Linux
~/.local/share/unity3d/Asset Store-5.x, one subfolder per publisher,
overridable with ASSETSTORE_CACHE_PATH); the tool could link or copy them
from there into the library folder (inference, untested).

Mixed bundles: a few bundles mix Unity vouchers with Fab codes. Where the
bundle as a whole routes to Fab (vendors/fab), the Unity items have item
recipes under items/unity-asset-store/ that point here. The developer list
below exists only for "Arcade Paradise: Game Dev Treasure Chest", whose
bundle also holds a Steam game, so the bundle itself can't be matched
without pulling the game off the Steam route.

Wave 2 additions (engine-asset residue):
  * Holiday Encore: Unity Art / Unity Tools (December 2022) say "A single
    key will be provided to redeem all of your content from Unity": one
    voucher for the whole bundle. The guarded "from Unity" rule below
    skips course bundles, because Humble pasted the same sentence into a
    Mammoth Interactive course bundle (complete-unity-unreal-engine-online-
    course) whose keys go to Mammoth. Cafofo's Footsteps Sound Pack in Unity
    Art is also a Humble direct download (hb-drmfree): fetch that file too.
  * Extreme Environment and Monster Unity Bundle (NatureManufacture + Magic
    Pig Games, 2026; text: "Please read here", redeem before June 1st, 2027)
    and Game Dev's Guide to Fantasy Character Assets (Infinity PBR, 2023;
    a bundle "curated for Unity game developers" that also holds an Asset
    Store 10%-off coupon): the text names no store; both are taken to be
    Asset Store vouchers like the earlier NatureManufacture and Infinity PBR
    / NatureManufacture Crown Collection bundles, which said so (inference).
  * Unity editions inside bundles routed to Fab have item recipes here:
    Meshingun's Gothic Megapack, Gothic Interior Megapack and Medieval
    Village Megapack "(Unity)" (Deluxe Dev Dream), Apocalyptic Hospital
    "(Unity)" (Level Up: 5K World Building Assets), and Freshcan3D's four
    "- UNITY" environments (Epic Environments Mega Bundle). The Asset Store
    10%-off coupons are items/unity-asset-store/asset-store-10-off-coupon
    (a checkout coupon, not a product voucher).
NatureManufacture, Infinity PBR / Magic Pig Games and Meshingun have no
redemption site of their own for Humble keys: their Unity items come here,
their Unreal items go to vendors/fab.

Wave 3:
  * Older Unity bundles, routed by slug: Humble Unity Bundle 2019 (Asset Store
    vouchers per item, plus Unity Learn Premium and a GameDevHQ course, both
    with item recipes here), Unity Games & Game Dev Assets (2020: "Redeem on
    Unity Asset Store and on Steam"), Unity Fantasy and Unity FPS Games & Game
    Dev Assets (2021: "A single key will be provided to redeem all the Unity
    assets in your bundle"; Fantasy's Zenva course has an item recipe that
    sends it to vendors/zenva), Ultimate Fantasy Game Development (2020,
    Infinity PBR). Their Steam games are hb-steam and stay on Steam.
  * Infinity PBR by developer: the Ultimate Unity Fantasy RPG bundle (2022)
    mixes its Unity packs with Jason Weimann's courses (game.courses), so it
    gets no bundle rule.
  * Top Notch Unity Assets (Chris West, 2026) and Ultimate Stylized Bundle
    (SICS Games, 2026): texts say only "Redeem your keys"; both publishers
    sell these packs on the Asset Store (SICS's Toon packs are in Unity's
    own mega-bundles), so Asset Store vouchers by inference.
  * Mixed Fab + Unity bundles now stay with vendors/fab (see the
    redeem_text comment); new "(Unity)" item recipes: Supreme 1-3
    (befour-*, gabriel-aguiar-*, entroverse-lab-*), Existence Studio's sea
    creatures, six Leartes/StylArts items of the Ultimate Game Development
    Bundle, and Hivemind's under items/hivemind/.
"""

[match]
# Unity-only Asset Store publishers from arcade-paradise-game-dev-treasure-chest
# (the bundle's Steam game, Arcade Paradise by Nosebleed Interactive, stays on
# generic/steam-key).
developers = [
  "A-ravlik", "Arcade Bridge", "PolySquid", "Tank & Healer Studio",
  "Target Studio", "JustCreate", "VAIZZ", "Kronnect", "Infinity Code",
  "Perfect Games", "StarryMoMo Studio", "Dunno", "Mena", "Reinforce Games",
  "gamevanilla", "Dustyroom", "FImpossible Creations", "M STUDIO HUB",
  "polyperfect", "SoftLeitner", "Cainos", "Kyeoms", "Layer Lab", "Ash Dev",
  # Infinity PBR (Magic Pig Games): Unity-only Humble items in bundles that also hold
  # someone else's keys (Ultimate Unity Fantasy RPG: Jason Weimann's courses), so no
  # bundle rule there. Its one Unreal bundle (Unreal Nature & Fantasy Assets) is claimed
  # by vendors/fab's bundle rules, which outrank this developer rule.
  "Infinity PBR",
]
bundle_slugs = [
  "^asset-store-mega",          # "Asset Store Mega Bundle" series
  "^unity-powerhouse-bundle",   # text only says "instructions here" -> assetstore.unity.com/humble-bundle-redemption
  "-unity-exclusive-",          # bad-asset-bundle-unity-exclusive (Meshingun)
  "^holiday-encore-unity-",     # Holiday Encore: Unity Art / Unity Tools (one voucher per bundle)
  "^extreme-environment-and-monster-unity-bundle",   # text: "Please read here" (inference)
  "game-dev-?s-guide-to-fantasy-character-assets",   # Infinity PBR, Unity-only (inference)
  # Wave 3: older (2019-2021) Unity bundles and Unity-only publisher bundles.
  "^unity-20\\d\\d-bundle",                             # Humble Unity Bundle 2019: "instructions linked on the download page"
  "^unity-games-and-game-dev-assets",                   # 2020: "Redeem on Unity Asset Store and on Steam" (games are hb-steam)
  "^unity-fantasy-games-dev-assets",                    # 2021: "can be redeemed on the Unity website" + Steam games (hb-steam)
  "^unity-fps-games-and-game-dev-assets",               # 2021: same wording
  "^ultimate-fantasy-game-development(?:-software)?$",  # 2020, Infinity PBR: "5 Star Rating on Unity ... Redeem your keys"
  "^top-notch-unity-assets",                            # 2026, Chris West's Unity tools; text names no store (inference)
  "^ultimate-stylized-bundle-sics-games",               # 2026, SICS Games' Unity "Toon" packs; text names no store (inference)
]
# "... redeemable on the Unity website", "Redeemable on Unity Asset Store website",
# "Keys are redeemed through Unity Store website". The lookaheads skip bundles
# that also contain a Steam game, so the game is not pulled onto this route, and
# bundles whose text also names Fab: those mix Fab codes with Unity vouchers
# ("Keys are redeemed through Fab and Unity Store website", "Keys are redeemable
# through Unity and FAB website") and go to vendors/fab as a whole, with item
# recipes here for their "(Unity)" / "(Unity Engine)" editions.
redeem_text = [
  '(?s)^(?!.*\bon Steam\b)(?!.*\bFab\b).*\bredeem\w*(?:\s|&nbsp;|\u00a0)+(?:on|via|through|at|from)(?:\s|&nbsp;|\u00a0)+(?:the(?:\s|&nbsp;|\u00a0)+)?Unity\b',
  # Not in Cosmos (Leartes) bundles: Big Bang says "provides Unity Asset Store keys directly with
  # your purchase" but every item is a Cosmos code (vendors/leartes-cosmos); the extra Unity keys
  # resolve here at key level (key_names / domains).
  '(?s)^(?!.*\bon Steam\b)(?!.*\bCosmos\b)(?!.*\bFab\b).*\bUnity Asset Store (?:vouchers?|keys?|codes?)\b',
  # "A single key will be provided to redeem all of your content from Unity." (not in course bundles)
  '(?s)^(?!.*\bon Steam\b)(?!.*\bcourses?\b)(?!.*\bFab\b).*\bredeem\w*[^.]{0,60}\bfrom(?:\s|&nbsp;| )+(?:the(?:\s|&nbsp;| )+)?Unity\b',
]
domains = ["assetstore.unity.com", "id.unity.com"]
key_names = ['unity asset store', '\(\s*unity(?: engine)?\s*\)', 'unity voucher']

[redeem]
where = "https://id.unity.com/en/redeem_products/new"
account = true
delivers = "Asset Store licences in a Unity organization; assets then appear under My Assets (web) and Package Manager > My Assets (Unity Editor)"
expiry_text = "Unity: Humble Bundle vouchers must be redeemed within 12 months of purchase; many bundle pages give an earlier or later 'redeem before' date (e.g. Asset Store Mega 15: April 1st 2027; Unity Powerhouse: October 31 2027; Extreme Environment and Monster Unity Bundle: June 1st 2027) - treat the earlier date as the deadline"
steps = [
  "Sign in to (or create) a Unity ID at https://id.unity.com/.",
  "Open Redeem code (https://id.unity.com/en/redeem_products/new; 'My Account' > 'Redeem a product code'), paste one Humble key, click Redeem.",
  "Choose the product and the organization to receive the licences (Unity's help article says Humble vouchers can only be redeemed under the default organization), accept the terms, Confirm.",
  "Repeat for every key; each code is one redemption.",
  "Check https://assetstore.unity.com/ > My Assets. Entitlements can take a few hours. If an asset is missing: id.unity.com > Organizations > (the organization used) > Asset Management; if it is listed there, revoke and re-assign your seat (Manage Seats). Still missing after 48 h: contact Unity Customer Experience with the bundle name, asset name and organization.",
  "In the Unity Editor: Window > Package Manager > My Assets > Download, then Import into a project.",
]

[download]
scriptable = false
how = "inside the Unity Editor: Window > Package Manager > My Assets > Download"
notes = "No public download API for Asset Store packages. After the Editor has downloaded them, the .unitypackage files are in the Editor's asset cache (platforms.*.asset_cache), which the tool could link or copy into the library folder (inference, untested)."

[library]
files = ".unitypackage files from the Editor's asset cache, one per asset, once the user has downloaded them in the Editor"

[install]
source = "vendor"
serial = "none"
silent = false
notes = "No installer. Assets are downloaded and imported per project inside the Unity Editor (Unity Hub + Editor run natively on macOS and Linux). The tool's job ends at redemption; optionally it links the Editor's cached .unitypackage files into the library folder."

[platforms.macos]
runner = "native"
asset_cache = "~/Library/Unity/Asset Store-5.x"

[platforms.linux]
runner = "native"
asset_cache = "~/.local/share/unity3d/Asset Store-5.x"

