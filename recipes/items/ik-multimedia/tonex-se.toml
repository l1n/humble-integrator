schema = 1
name = "TONEX SE"
vendor = "ik-multimedia"
kind = "addon"
machine_names = ["tonexse"]
verified = false
notes = """
AI Machine Modeling tone app: creates, plays, browses and edits Tone Models; standalone and plug-in; 200+ premium Tone Models (Humble's description). No Steam entry.
"""

[install]
source = "vendor"
serial = "per-product"
notes = "Register the Humble serial on the IK account, then install from IK Product Manager (Software tab; sample content from the Sounds tab). Authorization happens in Product Manager."

[steam]
shortcut = false

[platforms.macos]
runner = "native"

[platforms.linux]
runner = "wine"
bridge = "yabridge"
prefix = "audio-plugins"
notes = "No Linux build. Untested: Windows installer into the shared audio-plugins Wine prefix, bridged into a Linux DAW with yabridge."

[[sources]]
url = "https://www.humblebundle.com/software/ik-multimedia-presents-audio-master-suite-software"
claim = "'Standalone application and plug-in to create, play and share Tone Models. Includes 200+ Premium Tone Models' (census)"

[[sources]]
url = "https://support.humblebundle.com/hc/en-us/articles/29332171355675-IK-Multimedia-Redemption-Instructions-EULA"
claim = "register at ikmultimedia.com/registration; IK Product Manager: Software tab > Install, Sounds tab > Install"
